<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña — Herramienta Fiscal Cripto</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="icon" href="/static/favicon.ico">
<link rel="manifest" href="/static/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #080c12;
  --surface: #10141e;
  --surf2:   #1a1f2e;
  --border:  rgba(255,255,255,0.09);
  --text:    #eef0f6;
  --muted:   #7a8099;
  --accent:  #00C896;
  --red-dim: rgba(226,75,74,0.10);
  --red-brd: rgba(226,75,74,0.22);
  --ff-h:    'Syne', sans-serif;
  --ff-b:    'DM Sans', sans-serif;
}

html, body {
  min-height: 100%; background: var(--bg);
  font-family: var(--ff-b); color: var(--text);
  overflow-x: hidden;
}

.bg-shapes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.shape { position: absolute; animation: floatUp linear infinite; }
@keyframes floatUp {
  0%   { transform: translateY(0)    rotate(0deg); }
  50%  { transform: translateY(-28px) rotate(180deg); }
  100% { transform: translateY(0)    rotate(360deg); }
}

.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem 1rem;
}

.brand {
  font-family: var(--ff-h); font-size: 1rem; font-weight: 700;
  letter-spacing: -0.02em; color: var(--text); text-decoration: none;
  margin-bottom: 1.4rem;
}
.brand em { color: var(--accent); font-style: normal; }

.card {
  background: rgba(16,20,30,0.96);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px;
  width: 100%; max-width: 440px;
  padding: 2.5rem 2.25rem 2.25rem;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55);
}
.card-title {
  font-family: var(--ff-h); font-size: 2.1rem; font-weight: 800;
  letter-spacing: -0.04em; margin-bottom: 0.35rem;
}
.card-sub {
  color: var(--muted); font-size: 0.9rem; margin-bottom: 1.75rem; line-height: 1.5;
}

.field { margin-bottom: 1rem; }
.field label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.field input {
  width: 100%; background: var(--surf2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--ff-b);
  font-size: 15px; padding: 13px 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.field input::placeholder { color: #3d4560; }
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,200,150,0.12);
}

.form-error {
  background: var(--red-dim); border: 1px solid var(--red-brd);
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; color: #d9a5a4; margin-bottom: 1rem;
}
.form-success {
  background: rgba(0,200,150,0.10); border: 1px solid rgba(0,200,150,0.28);
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; color: #5ee8c0; margin-bottom: 1rem;
}

.btn-submit {
  width: 100%; padding: 14px; margin-top: 0.25rem;
  background: var(--accent); color: #080c12;
  border: none; border-radius: 12px;
  font-family: var(--ff-h); font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  letter-spacing: -0.01em;
}
.btn-submit:hover { opacity: 0.9; }
.btn-submit:active { transform: scale(0.99); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

.card-footer {
  text-align: center; margin-top: 1.6rem;
  font-size: 14px; color: var(--muted);
}
.card-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
.card-footer a:hover { text-decoration: underline; }

/* invalid token state */
#invalidState { display: none; }
</style>
</head>
<body>

<div class="bg-shapes" id="bgShapes"></div>

<div class="page">
  <a href="/" class="brand">mariano<em>sevilla</em>.com</a>

  <!-- Form state -->
  <div class="card" id="formCard">
    <h1 class="card-title">Nueva contraseña</h1>
    <p class="card-sub">Introduce tu nueva contraseña para acceder a tu cuenta.</p>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="newPass">Nueva contraseña</label>
        <input type="password" id="newPass" name="password"
               autocomplete="new-password" placeholder="Mínimo 8 caracteres"
               required minlength="8">
      </div>
      <div class="field">
        <label for="confirmPass">Repetir contraseña</label>
        <input type="password" id="confirmPass" name="confirm_password"
               autocomplete="new-password" placeholder="Repite la contraseña"
               required minlength="8">
      </div>
      <div class="form-error"   id="resetError"   hidden></div>
      <div class="form-success" id="resetSuccess" hidden></div>
      <button type="submit" class="btn-submit" id="resetBtn">Actualizar contraseña</button>
    </form>

    <p class="card-footer"><a href="/login/">Volver al inicio de sesión</a></p>
  </div>

  <!-- Invalid / expired token state -->
  <div class="card" id="invalidCard" hidden>
    <h1 class="card-title" style="font-size:1.6rem;">Enlace no válido</h1>
    <p class="card-sub" id="invalidMsg">Este enlace de recuperación no es válido o ha expirado.</p>
    <p class="card-footer" style="margin-top:0;"><a href="/login/">Solicitar un nuevo enlace</a></p>
  </div>
</div>

<script>
// ── Floating background shapes ──────────────────
(function () {
  const host    = document.getElementById('bgShapes');
  const palette = ['#00C896','#00bfff','#a78bfa','#fb923c','#f43f5e','#facc15'];
  const kinds   = ['circle', 'diamond', 'rect'];
  for (let i = 0; i < 24; i++) {
    const el   = document.createElement('div');
    const kind = kinds[i % kinds.length];
    const size = 11 + Math.random() * 22;
    const col  = palette[Math.floor(Math.random() * palette.length)];
    const x    = Math.random() * 100;
    const y    = Math.random() * 100;
    const dur  = 7 + Math.random() * 11;
    const del  = -(Math.random() * 10);
    let css    = `position:absolute;left:${x}%;top:${y}%;opacity:.13;`
               + `animation:floatUp ${dur}s ${del}s linear infinite;`;
    if (kind === 'circle')
      css += `width:${size}px;height:${size}px;border-radius:50%;background:${col};`;
    else if (kind === 'diamond')
      css += `width:${size}px;height:${size}px;background:${col};transform:rotate(45deg);`;
    else
      css += `width:${size * 1.4}px;height:${size * 0.7}px;background:${col};border-radius:3px;`;
    el.style.cssText = css;
    host.appendChild(el);
  }
})();

// ── Extract token from URL path ─────────────────
// URL is /reset-password/<token>
const _token = (function () {
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1] || '';
})();

if (!_token) {
  document.getElementById('formCard').hidden   = true;
  document.getElementById('invalidCard').hidden = false;
}

// ── Reset form ──────────────────────────────────
const resetForm    = document.getElementById('resetForm');
const resetErrorEl = document.getElementById('resetError');
const resetSuccEl  = document.getElementById('resetSuccess');
const resetBtn     = document.getElementById('resetBtn');

resetForm.addEventListener('submit', async e => {
  e.preventDefault();
  resetErrorEl.hidden = true;
  resetSuccEl.hidden  = true;

  const pw      = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;

  if (pw !== confirm) {
    resetErrorEl.textContent = 'Las contraseñas no coinciden.';
    resetErrorEl.hidden = false;
    return;
  }

  resetBtn.disabled    = true;
  resetBtn.textContent = 'Actualizando…';

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: _token, password: pw, confirm_password: confirm }),
    });
    const data = await res.json();

    if (!res.ok) {
      if (res.status === 400 && data.error && data.error.toLowerCase().includes('válido')) {
        document.getElementById('formCard').hidden    = true;
        document.getElementById('invalidCard').hidden  = false;
        document.getElementById('invalidMsg').textContent = data.error;
        return;
      }
      throw new Error(data.error || 'Error al actualizar la contraseña.');
    }

    resetForm.hidden         = true;
    resetSuccEl.textContent  = data.message;
    resetSuccEl.hidden       = false;
    setTimeout(() => { window.location.href = '/login/'; }, 2500);
  } catch (err) {
    resetErrorEl.textContent = err.message;
    resetErrorEl.hidden      = false;
  } finally {
    resetBtn.disabled    = false;
    resetBtn.textContent = 'Actualizar contraseña';
  }
});
</script>
</body>
</html>
