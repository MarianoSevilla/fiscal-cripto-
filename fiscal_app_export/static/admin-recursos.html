<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel recursos — Mariano Sevilla</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="icon" href="/static/favicon.ico">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nav.css">
<link rel="preload" href="/static/nav.js" as="script">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0b1220;
  --surface: #141f32;
  --surf2:   #1a2540;
  --border:  rgba(255,255,255,0.08);
  --text:    #eef0f6;
  --muted:   #7a8099;
  --sub:     #9aa0b8;
  --accent:  #00C896;
  --accent2: #00a87e;
  --ff-h:    'Syne', sans-serif;
  --ff-b:    'DM Sans', sans-serif;
}
html, body { min-height: 100%; background: var(--bg); font-family: var(--ff-b); color: var(--text); overflow-x: hidden; }
body { padding-top: 64px; }

.layout { display: flex; height: calc(100vh - 64px); }

/* SIDEBAR */
.sidebar {
  width: clamp(280px, 30vw, 420px); flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-filters {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; flex-direction: column;
}
.sidebar-search {
  width: 100%; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 7px 10px; border-radius: 7px; outline: none;
}
.sidebar-search::placeholder { color: var(--muted); }
.sidebar-search:focus { border-color: rgba(0,200,150,0.4); }
.sidebar-filter-row { display: flex; gap: 8px; }
.sidebar-filters select {
  flex: 1; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 7px 10px; border-radius: 7px; outline: none; appearance: none;
}
.sidebar-filters select:focus { border-color: rgba(0,200,150,0.4); }
.sidebar-list { flex: 1; overflow-y: auto; }
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.request-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.request-item:hover { background: var(--surf2); }
.request-item.active { background: rgba(0,200,150,0.07); border-left: 3px solid var(--accent); }
.req-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.req-name { font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.req-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
.req-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap;
}
.badge-recibido             { background: rgba(56,189,248,0.15);  color: #38bdf8; }
.badge-pendiente_validacion { background: rgba(251,191,36,0.15);  color: #fbbf24; }
.badge-aprobado             { background: rgba(0,200,150,0.15);   color: #00C896; }
.badge-rechazado            { background: rgba(239,68,68,0.15);   color: #f87171; }
.badge-enviado              { background: rgba(34,197,94,0.15);   color: #4ade80; }

.list-loading { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* DETAIL */
.detail-panel {
  flex: 1; overflow-y: auto; padding: 24px clamp(16px,3vw,32px);
}
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-track { background: transparent; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.detail-empty {
  display: flex; align-items: center; justify-content: center; height: 100%;
  color: var(--muted); font-size: 15px; text-align: center;
}
.detail-header { margin-bottom: 24px; }
.detail-id { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.detail-name { font-family: var(--ff-h); font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.detail-resource { font-size: 14px; color: var(--accent); font-weight: 600; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
@media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-field { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
.detail-field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.detail-field-value { font-size: 14px; color: var(--text); word-break: break-word; }

.detail-section { margin-bottom: 24px; }
.detail-section-title {
  font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase;
  letter-spacing: .1em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* Actions */
.action-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 16px;
}
.action-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.action-row { display: flex; gap: 10px; align-items: flex-end; }
.action-select, .action-textarea {
  flex: 1; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 9px 12px; border-radius: 7px; outline: none; appearance: none;
}
.action-select:focus, .action-textarea:focus { border-color: rgba(0,200,150,0.4); }
.action-textarea { resize: vertical; min-height: 80px; }
.action-btn {
  background: var(--accent); color: #0b1220; font-family: var(--ff-b);
  font-weight: 600; font-size: 13px; padding: 9px 18px; border: none;
  border-radius: 7px; cursor: pointer; white-space: nowrap; transition: background .2s; flex-shrink: 0;
}
.action-btn:hover { background: var(--accent2); }
.action-btn:disabled { opacity: .5; cursor: not-allowed; }
.msg-ok  { font-size: 13px; color: var(--accent); margin-top: 8px; }
.msg-err { font-size: 13px; color: #f87171; margin-top: 8px; }

/* Notes */
.note-add-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
.note-input {
  flex: 1; min-width: 180px; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 9px 12px; border-radius: 7px; outline: none; resize: vertical; min-height: 72px;
}
.note-input:focus { border-color: rgba(0,200,150,0.4); }
.note-input::placeholder { color: var(--muted); }
.text-block {
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 14px 16px; font-size: 13px; color: var(--sub); line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.notes-empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

/* Danger button */
.btn-danger {
  background: transparent; color: #f87171; font-family: var(--ff-b);
  font-weight: 600; font-size: 13px; padding: 9px 18px;
  border: 1px solid rgba(248,113,113,0.35);
  border-radius: 7px; cursor: pointer; white-space: nowrap; transition: all .2s;
}
.btn-danger:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.6); }
.btn-danger:disabled { opacity: .4; cursor: not-allowed; }

/* Confirm modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
}
.modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px 28px 24px; max-width: 380px; width: 100%;
}
.modal-title { font-family: var(--ff-h); font-size: 18px; color: var(--text); margin-bottom: 10px; }
.modal-body  { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<nav id="site-nav">
  <div class="snav-inner">
    <a href="/" class="snav-logo">mariano<span>sevilla</span>.com</a>
    <ul class="snav-links">
      <li><a href="/como-funciona">Cómo funciona</a></li>
      <li><a href="/recursos">Recursos</a></li>
      <li><a href="/faq">FAQ</a></li>
      <li><a href="/contacto">Contacto</a></li>
    </ul>
    <div class="snav-right"><div class="snav-skeleton" aria-hidden="true"></div></div>
  </div>
</nav>
<script src="/static/nav.js"></script>

<!-- Confirm delete modal (hidden by default) -->
<div class="modal-backdrop" id="deleteModal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
  <div class="modal-box">
    <div class="modal-title" id="deleteModalTitle">Eliminar solicitud</div>
    <div class="modal-body">¿Seguro que quieres eliminar esta solicitud? Esta acción no se puede deshacer.</div>
    <div class="modal-actions">
      <button class="action-btn" style="background:var(--surf2);color:var(--text);" onclick="closeDeleteModal()">Cancelar</button>
      <button class="btn-danger" id="deleteConfirmBtn" onclick="confirmDelete()">Eliminar</button>
    </div>
  </div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-filters">
      <input class="sidebar-search" id="search" type="text" placeholder="Buscar por nombre o email…">
      <div class="sidebar-filter-row">
        <select id="filter-status">
          <option value="">Todos los estados</option>
          <option value="recibido">Recibido</option>
          <option value="pendiente_validacion">Pendiente validación</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
          <option value="enviado">Enviado</option>
        </select>
      </div>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="list-loading">Cargando…</div>
    </div>
  </aside>

  <!-- DETAIL -->
  <main class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">
      Selecciona una solicitud para ver el detalle.
    </div>
    <div id="detail-content" style="display:none"></div>
  </main>

</div>

<script>
(function () {
  const STATUSES = {
    recibido:             'Recibido',
    pendiente_validacion: 'Pendiente validación',
    aprobado:             'Aprobado',
    rechazado:            'Rechazado',
    enviado:              'Enviado',
  };

  let allItems     = [];
  let currentId    = null;

  // ── Load list ──────────────────────────────────────────────────────────────
  async function loadList(status = '') {
    const url = '/api/admin/recursos/solicitudes' + (status ? `?status=${status}` : '');
    try {
      const res  = await fetch(url);
      const data = await res.json();
      allItems = data;
      renderList(data);
    } catch (e) {
      document.getElementById('sidebar-list').innerHTML =
        '<div class="list-loading">Error al cargar solicitudes.</div>';
    }
  }

  function renderList(items) {
    const el = document.getElementById('sidebar-list');
    if (!items.length) {
      el.innerHTML = '<div class="list-loading">Sin resultados.</div>';
      return;
    }
    el.innerHTML = items.map(r => `
      <div class="request-item${r.id === currentId ? ' active' : ''}" data-id="${r.id}" onclick="openDetail(${r.id})">
        <div class="req-item-header">
          <div class="req-name">${esc(r.name)}</div>
          <span class="req-badge badge-${r.status}">${esc(r.status_label)}</span>
        </div>
        <div class="req-meta">
          <span>${esc(r.email)}</span>
          ${r.resource_title ? `<span>· ${esc(r.resource_title)}</span>` : ''}
          <span>· ${fmtDate(r.created_at)}</span>
        </div>
      </div>
    `).join('');
  }

  // ── Open detail ────────────────────────────────────────────────────────────
  window.openDetail = async function (id) {
    currentId = id;
    document.querySelectorAll('.request-item').forEach(el =>
      el.classList.toggle('active', parseInt(el.dataset.id) === id)
    );
    document.getElementById('detail-empty').style.display   = 'none';
    document.getElementById('detail-content').style.display = 'none';

    const res  = await fetch(`/api/admin/recursos/solicitudes/${id}`);
    const r    = await res.json();
    renderDetail(r);
  };

  function renderDetail(r) {
    const el = document.getElementById('detail-content');
    el.innerHTML = `
      <div class="detail-header">
        <div class="detail-id">#${r.id} · ${fmtDate(r.created_at)}</div>
        <div class="detail-name">${esc(r.name)}</div>
        <div class="detail-resource">${esc(r.resource_title || '—')}</div>
      </div>

      <div class="detail-grid">
        ${field('Email',      r.email)}
        ${field('Exchange',   r.exchange || '—')}
        ${field('Bitvavo',    r.bitvavo_status_label || '—')}
        ${field('UID',        r.uid || (r.uid_unknown ? 'No sabe dónde encontrarlo' : '—'))}
        ${field('Telegram',   r.telegram_user || '—')}
        ${field('Newsletter', r.marketing_consent ? 'Sí' : 'No')}
        ${field('Estado', `<span class="req-badge badge-${r.status}">${esc(r.status_label)}</span>`)}
      </div>

      <!-- Cambiar estado -->
      <div class="detail-section">
        <div class="detail-section-title">Cambiar estado</div>
        <div class="action-card">
          <div class="action-row">
            <select class="action-select" id="new-status">
              ${Object.entries(STATUSES).map(([v, l]) =>
                `<option value="${v}"${v === r.status ? ' selected' : ''}>${l}</option>`
              ).join('')}
            </select>
            <button class="action-btn" onclick="changeStatus(${r.id})">Guardar</button>
          </div>
          <div class="msg-ok" id="status-ok"></div>
          <div class="msg-err" id="status-err"></div>
        </div>
      </div>

      <!-- Notas internas -->
      <div class="detail-section">
        <div class="detail-section-title">Notas internas</div>
        <div class="note-add-wrap">
          <textarea class="note-input" id="nota-input" placeholder="Añadir nota interna…"></textarea>
          <button class="action-btn" onclick="addNote(${r.id})" style="align-self:flex-end">Añadir</button>
        </div>
        <div id="notes-container">
          ${r.internal_notes
            ? `<div class="text-block">${esc(r.internal_notes)}</div>`
            : `<div class="notes-empty">Sin notas todavía.</div>`
          }
        </div>
        <div class="msg-ok" id="note-ok"></div>
        <div class="msg-err" id="note-err"></div>
      </div>

      <!-- Eliminar -->
      <div class="detail-section" style="margin-top:8px;">
        <button class="btn-danger" onclick="deleteRequest(${r.id})">Eliminar solicitud</button>
      </div>
    `;
    el.style.display = 'block';
  }

  // ── Change status ──────────────────────────────────────────────────────────
  window.changeStatus = async function (id) {
    const status  = document.getElementById('new-status').value;
    const okEl    = document.getElementById('status-ok');
    const errEl   = document.getElementById('status-err');
    okEl.textContent = ''; errEl.textContent = '';

    try {
      const res  = await fetch(`/api/admin/recursos/solicitudes/${id}/estado`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      const data = await res.json();
      if (res.ok) {
        okEl.textContent = `Estado actualizado a "${data.status_label}".`;
        // Actualiza badge en sidebar
        allItems = allItems.map(r => r.id === id ? { ...r, status, status_label: data.status_label } : r);
        renderList(applySearch(document.getElementById('search').value));
      } else {
        errEl.textContent = data.error || 'Error al cambiar estado.';
      }
    } catch (_) {
      errEl.textContent = 'Error de conexión.';
    }
  };

  // ── Add note ───────────────────────────────────────────────────────────────
  window.addNote = async function (id) {
    const input  = document.getElementById('nota-input');
    const nota   = input.value.trim();
    const okEl   = document.getElementById('note-ok');
    const errEl  = document.getElementById('note-err');
    okEl.textContent = ''; errEl.textContent = '';
    if (!nota) return;

    try {
      const res  = await fetch(`/api/admin/recursos/solicitudes/${id}/nota`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nota }),
      });
      const data = await res.json();
      if (res.ok) {
        input.value = '';
        okEl.textContent = 'Nota guardada.';
        document.getElementById('notes-container').innerHTML =
          `<div class="text-block">${esc(data.internal_notes)}</div>`;
      } else {
        errEl.textContent = data.error || 'Error al guardar nota.';
      }
    } catch (_) {
      errEl.textContent = 'Error de conexión.';
    }
  };

  // ── Delete request ────────────────────────────────────────────────────────
  let pendingDeleteId = null;

  window.deleteRequest = function (id) {
    pendingDeleteId = id;
    document.getElementById('deleteModal').style.display = 'flex';
  };

  window.closeDeleteModal = function () {
    pendingDeleteId = null;
    document.getElementById('deleteModal').style.display = 'none';
  };

  window.confirmDelete = async function () {
    if (!pendingDeleteId) return;
    const id  = pendingDeleteId;
    const btn = document.getElementById('deleteConfirmBtn');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/admin/recursos/solicitudes/${id}`, { method: 'DELETE' });
      if (res.ok) {
        closeDeleteModal();
        allItems = allItems.filter(r => r.id !== id);
        currentId = null;
        renderList(applySearch(document.getElementById('search').value));
        document.getElementById('detail-content').style.display = 'none';
        document.getElementById('detail-empty').style.display   = 'flex';
      } else {
        const data = await res.json();
        alert(data.error || 'Error al eliminar la solicitud.');
        btn.disabled = false;
      }
    } catch (_) {
      alert('Error de conexión.');
      btn.disabled = false;
    }
  };

  // Cerrar modal al pulsar fuera
  document.getElementById('deleteModal').addEventListener('click', function (e) {
    if (e.target === this) closeDeleteModal();
  });

  // ── Search / filter ────────────────────────────────────────────────────────
  function applySearch(q) {
    if (!q) return allItems;
    const lq = q.toLowerCase();
    return allItems.filter(r =>
      r.name.toLowerCase().includes(lq) || r.email.toLowerCase().includes(lq)
    );
  }

  document.getElementById('search').addEventListener('input', function () {
    renderList(applySearch(this.value));
  });
  document.getElementById('filter-status').addEventListener('change', function () {
    loadList(this.value);
  });

  // ── Helpers ────────────────────────────────────────────────────────────────
  function field(label, value) {
    return `
      <div class="detail-field">
        <div class="detail-field-label">${label}</div>
        <div class="detail-field-value">${value}</div>
      </div>`;
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadList();
})();
</script>
</body>
</html>
