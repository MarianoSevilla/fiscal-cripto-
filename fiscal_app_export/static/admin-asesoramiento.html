<html lang="es">
<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0b1220;
  --surface: #141f32;
  --surf2:   #1a2540;
  --border:  rgba(255,255,255,0.08);
  --text:    #eef0f6;
  --muted:   #7a8099;
  --sub:     #9aa0b8;
  --accent:  #00C896;
  --accent2: #00a87e;
  --ff-h:    'Syne', sans-serif;
  --ff-b:    'DM Sans', sans-serif;
}
html, body { min-height: 100%; background: var(--bg); font-family: var(--ff-b); color: var(--text); overflow-x: hidden; }
body { padding-top: 64px; } /* espacio para el nav fixed unificado */

/* LAYOUT */
.layout { display: flex; height: calc(100vh - 64px); }

/* SIDEBAR */
.sidebar {
  width: clamp(280px, 30vw, 420px); flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-filters {
  padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-direction: column;
}
.sidebar-search {
  width: 100%; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 7px 10px; border-radius: 7px; outline: none;
}
.sidebar-search::placeholder { color: var(--muted); }
.sidebar-search:focus { border-color: rgba(0,200,150,0.4); }
.sidebar-filter-row { display: flex; gap: 8px; }
.sidebar-filters select {
  flex: 1; min-width: 100px; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 7px 10px; border-radius: 7px; outline: none; appearance: none;
}
.sidebar-filters select:focus { border-color: rgba(0,200,150,0.4); }
.sidebar-list { flex: 1; overflow-y: auto; }
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.request-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.request-item:hover { background: var(--surf2); }
.request-item.active { background: rgba(0,200,150,0.07); border-left: 3px solid var(--accent); }
.req-name { font-weight: 600; font-size: 14px; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.req-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.req-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  white-space: nowrap;
}
.badge-submitted        { background: rgba(56,189,248,0.15);  color: #38bdf8; }
.badge-pendiente_info   { background: rgba(167,139,250,0.15); color: #a78bfa; }
.badge-quote_sent       { background: rgba(251,191,36,0.15);  color: #fbbf24; }
.badge-paid_received    { background: rgba(0,200,150,0.15);   color: #00C896; }
.badge-under_review     { background: rgba(99,102,241,0.15);  color: #818cf8; }
.badge-waiting_user_info{ background: rgba(251,146,60,0.15);  color: #fb923c; }
.badge-in_progress      { background: rgba(56,189,248,0.15);  color: #38bdf8; }
.badge-completed        { background: rgba(34,197,94,0.15);   color: #4ade80; }
.badge-cancelled        { background: rgba(226,75,74,0.15);   color: #f87171; }
.badge-refunded         { background: rgba(156,163,175,0.15); color: #9ca3af; }

/* Reply section (unified: message + quote) */
.reply-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
.reply-field { margin-bottom: 14px; }
.reply-field label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
.reply-field textarea, .reply-field input[type=number] {
  width: 100%; background: var(--surf2); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 14px;
  padding: 9px 12px; border-radius: 7px; outline: none; transition: border-color .2s;
}
.reply-field textarea { resize: vertical; min-height: 100px; }
.reply-field textarea:focus, .reply-field input[type=number]:focus { border-color: rgba(0,200,150,0.4); }
.reply-check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); cursor: pointer; margin-bottom: 10px; }
.reply-check-row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
.reply-amount-wrap { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .2s ease, opacity .2s ease; }
.reply-amount-wrap.visible { max-height: 80px; opacity: 1; }
.reply-pendiente-wrap { transition: opacity .15s; }
.reply-pendiente-wrap.hidden { opacity: 0; pointer-events: none; }
.reply-quote-info { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.reply-quote-link { font-size: 12px; color: var(--accent); word-break: break-all; margin-bottom: 12px; }
.reply-send-btn {
  width: 100%; font-family: var(--ff-b); font-weight: 700; font-size: 14px;
  padding: 10px; border: none; border-radius: 7px; cursor: pointer; transition: background .2s;
}
.reply-send-btn.mode-msg   { background: var(--accent); color: #0b1220; }
.reply-send-btn.mode-quote { background: #fbbf24;       color: #1a1200; }
.reply-send-btn:hover:not(:disabled).mode-msg   { background: var(--accent2); }
.reply-send-btn:hover:not(:disabled).mode-quote { background: #f59e0b; }
.reply-send-btn:disabled { opacity: .55; cursor: not-allowed; }
.reply-ok  { font-size: 13px; color: #4ade80; margin-top: 8px; display: none; }
.reply-err { font-size: 13px; color: #f87171; margin-top: 8px; display: none; }

/* DETAIL PANEL */
.detail-panel {
  flex: 1; overflow-y: auto; padding: 24px clamp(16px,3vw,32px);
}
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-track { background: transparent; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.detail-empty {
  display: flex; align-items: center; justify-content: center; height: 100%;
  color: var(--muted); font-size: 15px; text-align: center;
}

.detail-header { margin-bottom: 24px; }
.detail-id { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.detail-name { font-family: var(--ff-h); font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.detail-service { font-size: 14px; color: var(--accent); font-weight: 600; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
@media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-field { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
.detail-field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.detail-field-value { font-size: 14px; color: var(--text); word-break: break-word; }

.detail-section { margin-bottom: 24px; }
.detail-section-title {
  font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase;
  letter-spacing: .1em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--surf2); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--sub); padding: 4px 12px; }

.text-block {
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 14px 16px; font-size: 14px; color: var(--sub); line-height: 1.7; white-space: pre-wrap;
}

/* Files */
.file-link {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; text-decoration: none; color: var(--text);
  font-size: 13px; margin-bottom: 8px; transition: border-color .2s;
}
.file-link:hover { border-color: rgba(0,200,150,0.35); }
.file-icon { font-size: 18px; flex-shrink: 0; }
.file-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Status history */
.history-item {
  padding: 10px 0; border-bottom: 1px solid var(--border);
  display: flex; gap: 12px; align-items: flex-start;
}
.history-item:last-child { border-bottom: none; }
.history-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex-shrink: 0; }
.history-content { flex: 1; }
.history-status { font-size: 13px; font-weight: 600; color: var(--text); }
.history-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.history-note { font-size: 13px; color: var(--sub); margin-top: 4px; font-style: italic; }

/* Admin actions */
.action-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 16px;
}
.action-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.action-row { display: flex; gap: 10px; align-items: flex-end; }
.action-select, .action-input, .action-textarea {
  flex: 1; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 9px 12px; border-radius: 7px; outline: none; appearance: none;
}
.action-select:focus, .action-input:focus, .action-textarea:focus {
  border-color: rgba(0,200,150,0.4);
}
.action-textarea { resize: vertical; min-height: 80px; }
.action-btn {
  background: var(--accent); color: #0b1220; font-family: var(--ff-b);
  font-weight: 600; font-size: 13px; padding: 9px 18px; border: none;
  border-radius: 7px; cursor: pointer; white-space: nowrap; transition: background .2s;
  flex-shrink: 0;
}
.action-btn:hover { background: var(--accent2); }
.action-btn:disabled { opacity: .5; cursor: not-allowed; }
.msg-ok  { font-size: 13px; color: var(--accent); margin-top: 8px; }
.msg-err { font-size: 13px; color: #f87171; margin-top: 8px; }

/* Loading / empty */
.list-loading { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* Priority indicator dot in sidebar */
.req-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.priority-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
  transition: background .2s;
}
.priority-dot.p-high    { background: #fb923c; }   /* paid_received, under_review */
.priority-dot.p-active  { background: #38bdf8; }   /* in_progress */
.priority-dot.p-payment { background: #fbbf24; }   /* pending_payment */
.priority-dot.p-waiting { background: #6b7280; }   /* waiting_user_info */
.priority-dot.p-done    { background: transparent; border: 1px solid var(--border); } /* completed, cancelled, refunded */

/* Last activity line */
.req-activity { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* Notes feed */
.note-add-wrap {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-bottom: 16px;
}
.note-input {
  flex: 1; min-width: 180px; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 9px 12px; border-radius: 7px; outline: none; resize: vertical; min-height: 72px;
}
.note-input:focus { border-color: rgba(0,200,150,0.4); }
.note-input::placeholder { color: var(--muted); }
.note-item {
  padding: 12px 14px; border-radius: 9px; margin-bottom: 10px;
  background: var(--surf2); border: 1px solid var(--border);
}
.note-item.note-new { border-color: rgba(0,200,150,0.25); animation: noteIn .25s ease; }
@keyframes noteIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.note-header { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.note-author { font-size: 12px; font-weight: 600; color: var(--accent); }
.note-time   { font-size: 11px; color: var(--muted); }
.note-text   { font-size: 13px; color: var(--sub); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.notes-empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

/* Danger button */
.btn-danger {
  background: transparent; color: #f87171; font-family: var(--ff-b);
  font-weight: 600; font-size: 13px; padding: 9px 18px;
  border: 1px solid rgba(248,113,113,0.35);
  border-radius: 7px; cursor: pointer; white-space: nowrap; transition: all .2s;
}
.btn-danger:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.6); }
.btn-danger:disabled { opacity: .4; cursor: not-allowed; }

/* Delete confirm modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
}
.modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px 28px 24px; max-width: 420px; width: 100%;
}
.modal-title { font-family: var(--ff-h); font-size: 18px; color: var(--text); margin-bottom: 12px; }
.modal-body  { font-size: 14px; color: var(--sub); line-height: 1.65; margin-bottom: 20px; }
.modal-confirm-wrap  { margin-bottom: 20px; }
.modal-confirm-label { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
.modal-confirm-input {
  width: 100%; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 14px; font-weight: 600;
  letter-spacing: .05em; padding: 9px 12px; border-radius: 7px; outline: none;
}
.modal-confirm-input:focus { border-color: rgba(248,113,113,0.5); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-cancel-btn {
  background: transparent; color: var(--muted); font-family: var(--ff-b);
  font-size: 13px; font-weight: 600; padding: 9px 18px;
  border: 1px solid var(--border); border-radius: 7px; cursor: pointer; transition: all .2s;
}
.modal-cancel-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
.modal-delete-btn {
  background: #ef4444; color: #fff; font-family: var(--ff-b);
  font-size: 13px; font-weight: 700; padding: 9px 20px;
  border: none; border-radius: 7px; cursor: pointer; transition: background .2s;
}
.modal-delete-btn:hover:not(:disabled) { background: #dc2626; }
.modal-delete-btn:disabled { opacity: .4; cursor: not-allowed; }
.modal-err { font-size: 13px; color: #f87171; margin-top: 10px; text-align: right; }
</style>
</head>

  <div class="snav-inner">

    <ul class="snav-links">
      <li><a href="/como-funciona">Cómo funciona</a></li>

<script src="/static/nav.js"></script>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-filters">
      <input type="search" id="searchInput" class="sidebar-search" placeholder="Buscar por nombre o email…" oninput="filterList()">
      <div class="sidebar-filter-row">
        <select id="filterStatus" onchange="loadList()">
          <option value="">Todos los estados</option>
          <option value="submitted">Solicitud recibida</option>
          <option value="pendiente_info">Pendiente de información</option>
          <option value="quote_sent">Presupuesto enviado</option>
          <option value="paid_received">Pago confirmado</option>
          <option value="under_review">En revisión</option>
          <option value="waiting_user_info">Esperando info</option>
          <option value="in_progress">En curso</option>
          <option value="completed">Finalizado</option>
          <option value="cancelled">Cancelado</option>
          <option value="refunded">Reembolsado</option>
        </select>
        <select id="filterService" onchange="loadList()">
          <option value="">Todos los servicios</option>
          <option value="revision_basica">Básica</option>
          <option value="revision_avanzada">Avanzada</option>
          <option value="caso_complejo">Complejo</option>
        </select>
      </div>
    </div>
    <div class="sidebar-list" id="sidebarList">
      <div class="list-loading">Cargando...</div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty">Selecciona una solicitud para ver los detalles</div>
  </div>
</div>

<script>
let currentId  = null;
let _allItems  = [];   // caché de la última carga para búsqueda client-side

// ── Tiempo relativo ────────────────────────────────────────────────────────
function relativeTime(iso) {
  if (!iso) return '—';
  const diff  = Date.now() - new Date(iso).getTime();
  const mins  = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days  = Math.floor(diff / 86400000);
  if (mins  <  2) return 'Ahora mismo';
  if (mins  < 60) return `Hace ${mins} min`;
  if (hours < 24) return `Hace ${hours} h`;
  if (days  ===1) return 'Ayer';
  if (days  <  7) return `Hace ${days} días`;
  return new Date(iso).toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

// ── Prioridad visual por estado ────────────────────────────────────────────
function getPriority(status) {
  if (['paid_received', 'under_review'].includes(status)) return 'high';
  if (status === 'in_progress')                           return 'active';
  if (status === 'submitted')                             return 'payment';
  if (status === 'quote_sent')                            return 'payment';
  if (['waiting_user_info', 'pendiente_info'].includes(status)) return 'waiting';
  return 'done';
}
function getPriorityTitle(status) {
  const map = {
    submitted:         'Pendiente de presupuesto',
    pendiente_info:    'Esperando información del cliente',
    quote_sent:        'Esperando pago del cliente',
    paid_received:     'Pago recibido — comenzar',
    under_review:      'Requiere revisión',
    in_progress:       'En curso',
    waiting_user_info: 'Esperando cliente',
    completed:         'Finalizado',
    cancelled:         'Cancelado',
    refunded:          'Reembolsado',
  };
  return map[status] || '';
}

const STATUS_LABELS = {
  submitted:         'Solicitud recibida',
  pendiente_info:    'Pendiente de información',
  quote_sent:        'Presupuesto enviado',
  paid_received:     'Pago confirmado',
  under_review:      'En revisión',
  waiting_user_info: 'Esperando información',
  in_progress:       'En curso',
  completed:         'Finalizado',
  cancelled:         'Cancelado',
  refunded:          'Reembolsado',
};

function renderList(items) {
  const list = document.getElementById('sidebarList');
  if (!items.length) {
    list.innerHTML = '<div class="list-loading">No hay solicitudes.</div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'request-item' + (item.id === currentId ? ' active' : '');
    el.dataset.id      = item.id;
    el.dataset.name    = (item.full_name  || '').toLowerCase();
    el.dataset.email   = (item.email      || '').toLowerCase();
    const amount   = item.amount_paid ? `${(item.amount_paid/100).toFixed(0)} €` : '—';
    const priority = getPriority(item.status);
    const pTitle   = getPriorityTitle(item.status);
    el.innerHTML = `
      <div class="req-item-header">
        <div class="req-name">${escHtml(item.full_name)}</div>
        <span class="priority-dot p-${priority}" title="${escHtml(pTitle)}"></span>
      </div>
      <div class="req-meta">
        <span class="req-badge badge-${item.status}">${escHtml(item.status_label)}</span>
        <span>${escHtml(item.service_label)}</span>
        <span>${amount}</span>
      </div>
      <div class="req-activity">${relativeTime(item.updated_at)}</div>
    `;
    el.addEventListener('click', () => openDetail(item.id, el));
    list.appendChild(el);
  });
}

function filterList() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  if (!q) { renderList(_allItems); return; }
  const filtered = _allItems.filter(it =>
    (it.full_name || '').toLowerCase().includes(q) ||
    (it.email     || '').toLowerCase().includes(q)
  );
  renderList(filtered);
}

async function loadList() {
  const status  = document.getElementById('filterStatus').value;
  const service = document.getElementById('filterService').value;
  const list    = document.getElementById('sidebarList');
  list.innerHTML = '<div class="list-loading">Cargando...</div>';

  try {
    let url = '/api/admin/asesoramiento/solicitudes';
    const params = new URLSearchParams();
    if (status)  params.set('status', status);
    if (service) params.set('service_type', service);
    if (params.toString()) url += '?' + params.toString();

    const r = await fetch(url, { credentials: 'include' });
    if (r.status === 403) {
      list.innerHTML = '<div class="list-loading">Acceso denegado.</div>';
      return;
    }
    _allItems = await r.json();
    filterList();
  } catch {
    list.innerHTML = '<div class="list-loading">Error al cargar.</div>';
  }
}

async function openDetail(id, el) {
  currentId = id;
  document.querySelectorAll('.request-item').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = '<div class="detail-empty">Cargando...</div>';

  try {
    const r = await fetch(`/api/admin/asesoramiento/solicitudes/${id}`, { credentials: 'include' });

    const opTypes  = (d.operation_types  || []).join(', ') || '—';

              <div class="history-status">${escHtml(label)}</div>

    });

      pendiente_info:    'Esperar respuesta del cliente al mensaje enviado.',

        <div class="detail-field"><div class="detail-field-label">Teléfono</div><div class="detail-field-value">${escHtml(d.phone||'—')}</div></div>
        <div class="detail-field"><div class="detail-field-label">País de residencia</div><div class="detail-field-value">${escHtml(d.tax_residence_country||'—')}</div></div>

        <div class="detail-field"><div class="detail-field-label">Importe presupuestado</div><div class="detail-field-value" style="color:#fbbf24;font-weight:600">${d.quoted_amount ? (d.quoted_amount/100).toLocaleString('es-ES',{minimumFractionDigits:2}) + ' €' : '—'}</div></div>

        <div class="detail-field"><div class="detail-field-label">Proveedor de pago</div><div class="detail-field-value">${escHtml((d.payment_provider||'').toUpperCase()||'—')}</div></div>
        <div class="detail-field"><div class="detail-field-label">PayPal Capture ID</div><div class="detail-field-value" style="font-size:12px;word-break:break-all">${escHtml(d.paypal_capture_id||'—')}</div></div>
        <div class="detail-field"><div class="detail-field-label">NIF / NIE / CIF</div><div class="detail-field-value">${escHtml(d.billing_nif||'—')}</div></div>
        <div class="detail-field"><div class="detail-field-label">Dirección de facturación</div><div class="detail-field-value">${d.billing_address ? escHtml([d.billing_address, d.billing_postal_code, d.billing_city].filter(Boolean).join(', ')) : '—'}</div></div>
        ${d.billing_company_name ? `<div class="detail-field"><div class="detail-field-label">Razón social</div><div class="detail-field-value">${escHtml(d.billing_company_name)}</div></div>` : ''}
        ${d.quote_accepted_at ? `<div class="detail-field"><div class="detail-field-label">Presupuesto aceptado</div><div class="detail-field-value">${new Date(d.quote_accepted_at).toLocaleString('es-ES')} · ${escHtml(d.quote_acceptance_ip||'')}</div></div>` : ''}
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Operativa cripto</div>

        <div class="text-block">${escHtml(d.case_description||'—')}</div>

      ${!['paid_received','completed','cancelled','refunded'].includes(d.status) ? `
      <div class="detail-section">
        <div class="detail-section-title">Responder al cliente</div>
        <div class="reply-section">
          ${d.status === 'quote_sent' && d.quote_sent_at ? `

          <div class="reply-field">
            <label>Mensaje para ${escHtml(d.full_name)}</label>
            <textarea id="replyText" placeholder="Hola, hemos revisado tu caso y…">${escHtml(d.status === 'quote_sent' ? (d.quote_message||'') : '')}</textarea>

      <!-- ACTIONS -->
      <div class="detail-section">

        <div class="action-card">

          <div id="statusMsg"></div>

        <div class="action-card" style="opacity:.5;pointer-events:none;">
          <div class="action-title" style="display:flex;align-items:center;gap:8px;">
            Asignar asesor
            <span style="font-size:11px;font-weight:400;background:rgba(99,102,241,0.15);color:#818cf8;padding:2px 8px;border-radius:20px;">Próximamente</span>
          </div>
          <div class="action-row">
            <select class="action-select" disabled>
              <option>${d.assigned_to ? 'Asesor #' + d.assigned_to : 'Sin asignar'}</option>
            </select>
            <button class="action-btn" disabled>Asignar</button>
          </div>
        </div>

        <div class="action-card" style="border-color:rgba(248,113,113,0.2);margin-top:4px;">
          <div class="action-title" style="color:#f87171">Zona de peligro</div>
          <div style="font-size:13px;color:var(--sub);margin-bottom:12px;">Solo para solicitudes de prueba, huérfanas o sin pago. Esta acción no se puede deshacer.</div>
          <button class="btn-danger" data-name="${escHtml(d.full_name)}" onclick="showDeleteModal(${d.id}, this.dataset.name)">🗑&nbsp; Eliminar solicitud</button>
          <div id="deleteMsg"></div>
        </div>
      </div>
    `;
  } catch {
    panel.innerHTML = '<div class="detail-empty">Error al cargar los detalles.</div>';
  }
}

function toggleReplyMode() {
  const isQuote    = document.getElementById('replyIsQuote')?.checked;
  const amountWrap = document.getElementById('replyAmountWrap');
  const pendWrap   = document.getElementById('replyPendienteWrap');
  const btn        = document.getElementById('replySendBtn');
  if (amountWrap) amountWrap.classList.toggle('visible', isQuote);
  if (pendWrap)   pendWrap.classList.toggle('hidden', isQuote);
  if (btn) {
    btn.classList.toggle('mode-quote', isQuote);
    btn.classList.toggle('mode-msg',  !isQuote);
    btn.textContent = isQuote ? 'Enviar presupuesto y link de pago' : 'Enviar mensaje al cliente';
  }
}

async function enviarRespuesta(id) {
  const btn     = document.getElementById('replySendBtn');
  const okEl    = document.getElementById('replyOk');
  const errEl   = document.getElementById('replyErr');
  const isQuote = document.getElementById('replyIsQuote')?.checked;
  const texto   = (document.getElementById('replyText')?.value || '').trim();

  okEl.style.display  = 'none';
  errEl.style.display = 'none';

  if (!texto) {
    errEl.textContent = 'El mensaje no puede estar vacío.';
    errEl.style.display = 'block';
    return;
  }

  if (isQuote) {
    const amount = parseFloat((document.getElementById('replyAmount')?.value || '').replace(',', '.'));
    if (!amount || amount < 1) {
      errEl.textContent = 'Introduce un importe válido (mínimo 1 €).';
      errEl.style.display = 'block';
      return;
    }
  }

  btn.disabled    = true;
  btn.textContent = 'Enviando…';

  try {
    let r, data;

    if (isQuote) {
      const amount = parseFloat((document.getElementById('replyAmount')?.value || '').replace(',', '.'));
      r    = await fetch(`/api/admin/asesoramiento/solicitudes/${id}/enviar-presupuesto`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount_euros: amount, message: texto }),
      });
      data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Error al enviar el presupuesto.');
      okEl.textContent = data.email_warning ? '✓ Presupuesto guardado.' : `✓ Presupuesto enviado a ${data.email_to}`;
      if (data.email_warning) { errEl.textContent = `⚠️ Email no enviado a ${data.email_to}. Revisa los logs de Railway.`; errEl.style.display = 'block'; }
    } else {
      const setPendiente = document.getElementById('replySetPendiente')?.checked ?? true;
      r    = await fetch(`/api/admin/asesoramiento/solicitudes/${id}/mensaje`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: texto, set_pendiente_info: setPendiente }),
      });
      data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Error al enviar el mensaje.');
      okEl.textContent = data.email_warning ? '✓ Mensaje registrado.' : `✓ Mensaje enviado a ${data.email_to}`;
      if (data.email_warning) { errEl.textContent = `⚠️ Email no enviado a ${data.email_to}. Revisa los logs de Railway.`; errEl.style.display = 'block'; }
    }

    okEl.style.display = 'block';
    await loadList();
    setTimeout(() => openDetail(id), 1300);
  } catch (err) {
    errEl.textContent   = err.message;
    errEl.style.display = 'block';
    btn.disabled        = false;
    btn.textContent     = isQuote ? 'Enviar presupuesto y link de pago' : 'Enviar mensaje al cliente';
  }
}

async function changeStatus(id) {
  const newStatus = document.getElementById('newStatus').value;
  const note      = document.getElementById('statusNote').value.trim();
  const btn       = document.getElementById('btnStatus');
  const msg       = document.getElementById('statusMsg');
  btn.disabled = true;
  msg.textContent = '';
  try {
    const r = await fetch(`/api/admin/asesoramiento/solicitudes/${id}/estado`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus, note }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    msg.className = 'msg-ok';
    msg.textContent = 'Estado actualizado correctamente.';
    await loadList();
  } catch (e) {
    msg.className = 'msg-err';
    msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

async function addNote(id) {
  const textarea = document.getElementById('noteInput');
  const btn      = document.getElementById('btnNote');
  const msg      = document.getElementById('noteMsg');
  const nota     = (textarea?.value || '').trim();
  if (!nota) { msg.className = 'msg-err'; msg.textContent = 'La nota no puede estar vacía.'; return; }
  btn.disabled = true;
  msg.className = '';
  msg.textContent = '';
  try {
    const r = await fetch(`/api/admin/asesoramiento/solicitudes/${id}/nota`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nota }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    msg.className = 'msg-ok';
    msg.textContent = '✓ Nota guardada';
    textarea.value = '';
    // Prepend nota al feed sin recargar toda la vista
    const feed    = document.getElementById('notesFeed');
    const emptyEl = feed?.querySelector('.notes-empty');
    if (emptyEl) emptyEl.remove();
    const noteEl = document.createElement('div');
    noteEl.className = 'note-item note-new';
    noteEl.innerHTML = `
      <div class="note-header">
        <span class="note-author">${escHtml(data.note.author_name || 'Admin')}</span>
        <span class="note-time">Ahora mismo</span>
      </div>
      <div class="note-text">${escHtml(data.note.text)}</div>`;
    feed?.insertBefore(noteEl, feed.firstChild);
    // Refrescar sidebar para actualizar "última actividad"
    loadList();
    setTimeout(() => { msg.textContent = ''; }, 3000);
  } catch (e) {
    msg.className = 'msg-err';
    msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function escHtml(str) {
  if (!str && str !== 0) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Delete advisory ────────────────────────────────────────────────────────
function showDeleteModal(id, name) {
  const modal = document.createElement('div');
  modal.id = 'deleteModal';
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">Eliminar solicitud</div>
      <div class="modal-body">
        Esta acción eliminará la solicitud de <strong>${escHtml(name)}</strong>
        y sus notas internas. No debería usarse para solicitudes reales ya gestionadas.<br><br>
        <strong style="color:#f87171">Esta acción no se puede deshacer.</strong>
      </div>
      <div class="modal-confirm-wrap">
        <div class="modal-confirm-label">Escribe <strong>ELIMINAR</strong> para confirmar:</div>
        <input type="text" class="modal-confirm-input" id="deleteConfirmInput"
               placeholder="ELIMINAR" oninput="checkDeleteConfirm()" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="modal-cancel-btn" onclick="closeDeleteModal()">Cancelar</button>
        <button class="modal-delete-btn" id="btnDeleteConfirm"
                onclick="confirmDelete(${id})" disabled>Eliminar</button>
      </div>
      <div id="modalDeleteErr" class="modal-err"></div>
    </div>
  `;
  modal.addEventListener('click', closeDeleteModal);
  document.body.appendChild(modal);
  setTimeout(() => document.getElementById('deleteConfirmInput')?.focus(), 50);
}

function checkDeleteConfirm() {
  const val = (document.getElementById('deleteConfirmInput')?.value || '').trim();
  const btn = document.getElementById('btnDeleteConfirm');
  if (btn) btn.disabled = (val !== 'ELIMINAR');
}

function closeDeleteModal() {
  document.getElementById('deleteModal')?.remove();
}

async function confirmDelete(id) {
  const btn = document.getElementById('btnDeleteConfirm');
  const err = document.getElementById('modalDeleteErr');
  if (btn) btn.disabled = true;
  if (err) err.textContent = '';
  try {
    const r = await fetch(`/api/admin/asesoramiento/solicitudes/${id}`, {
      method: 'DELETE', credentials: 'include',
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al eliminar.');
    closeDeleteModal();
    currentId = null;
    document.getElementById('detailPanel').innerHTML = `
      <div class="detail-empty" style="flex-direction:column;gap:4px;">
        <div style="font-size:28px;margin-bottom:10px;">🗑</div>
        <div style="color:var(--accent);font-weight:600;margin-bottom:4px;">Solicitud eliminada</div>
        <div style="font-size:13px;color:var(--muted)">Selecciona otra solicitud para continuar.</div>
      </div>`;
    await loadList();
  } catch (e) {
    if (err) err.textContent = e.message;
    if (btn) btn.disabled = false;
  }
}

// Init
loadList();
</script>
