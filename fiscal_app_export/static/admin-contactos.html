<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel contactos — Mariano Sevilla</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="icon" href="/static/favicon.ico">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nav.css">
<link rel="preload" href="/static/nav.js" as="script">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0b1220;
  --surface: #141f32;
  --surf2:   #1a2540;
  --border:  rgba(255,255,255,0.08);
  --border-hi: rgba(255,255,255,0.16);
  --text:    #eef0f6;
  --muted:   #7a8099;
  --sub:     #9aa0b8;
  --accent:  #00C896;
  --accent2: #00a87e;
  --yellow:  #fbbf24;
  --red:     #f87171;
  --ff-h:    'Syne', sans-serif;
  --ff-b:    'DM Sans', sans-serif;
}
html, body { min-height: 100%; background: var(--bg); font-family: var(--ff-b); color: var(--text); overflow-x: hidden; }
body { padding-top: 64px; }

.layout { display: flex; height: calc(100vh - 64px); }

/* SIDEBAR */
.sidebar {
  width: clamp(280px, 30vw, 420px); flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-title { font-family: var(--ff-h); font-size: 15px; font-weight: 700; }
.sidebar-count { font-size: 12px; color: var(--muted); }
.sidebar-filters {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px;
}
.sidebar-filters select {
  flex: 1; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--ff-b); font-size: 13px;
  padding: 7px 10px; border-radius: 7px; outline: none; appearance: none;
}
.sidebar-filters select:focus { border-color: rgba(0,200,150,0.4); }
.sidebar-filters input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.sidebar-filters label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
.sidebar-list { flex: 1; overflow-y: auto; }
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.request-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.request-item:hover { background: var(--surf2); }
.request-item.active { background: rgba(0,200,150,0.07); border-left: 3px solid var(--accent); }
.request-item.archived { opacity: 0.5; }
.req-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.req-name { font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.req-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
.req-preview { font-size: 12px; color: var(--sub); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.badge-nuevo       { background: rgba(251,191,36,0.15);  color: #fbbf24; }
.badge-respondido  { background: rgba(0,200,150,0.15);   color: #00C896; }
.badge-archivado   { background: rgba(122,128,153,0.15); color: #7a8099; }

.list-empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* DETAIL */
.detail-panel {
  flex: 1; overflow-y: auto; padding: 24px clamp(16px,3vw,32px);
}
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-track { background: transparent; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.detail-empty {
  display: flex; align-items: center; justify-content: center; height: 100%;
  color: var(--muted); font-size: 15px; text-align: center;
}
.detail-header { margin-bottom: 24px; }
.detail-meta-id { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.detail-name { font-family: var(--ff-h); font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.detail-email { font-size: 14px; color: var(--accent); font-weight: 500; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
@media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-field { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
.detail-field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.detail-field-value { font-size: 14px; color: var(--text); word-break: break-word; }

.detail-section { margin-bottom: 24px; }
.detail-section-title {
  font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase;
  letter-spacing: .1em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.text-block {
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 14px 16px; font-size: 14px; color: var(--sub); line-height: 1.75; white-space: pre-wrap; word-break: break-word;
}

/* Actions */
.action-row { display: flex; gap: 10px; flex-wrap: wrap; }
.action-btn {
  background: var(--accent); color: #0b1220; font-family: var(--ff-b);
  font-weight: 600; font-size: 13px; padding: 9px 18px; border: none;
  border-radius: 7px; cursor: pointer; white-space: nowrap; transition: background .2s;
}
.action-btn:hover { background: var(--accent2); }
.action-btn:disabled { opacity: .5; cursor: not-allowed; }
.action-btn.secondary {
  background: transparent; color: var(--yellow);
  border: 1px solid rgba(251,191,36,0.35);
}
.action-btn.secondary:hover { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.6); }
.action-btn.danger {
  background: transparent; color: var(--red);
  border: 1px solid rgba(248,113,113,0.35);
}
.action-btn.danger:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.6); }
.msg-ok  { font-size: 13px; color: var(--accent);  margin-top: 10px; min-height: 18px; }
.msg-err { font-size: 13px; color: var(--red); margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<nav id="site-nav">
  <div class="snav-inner">
    <a href="/" class="snav-logo">mariano<span>sevilla</span>.com</a>
    <ul class="snav-links">
      <li><a href="/como-funciona">Cómo funciona</a></li>
      <li><a href="/recursos">Recursos</a></li>
      <li><a href="/faq">FAQ</a></li>
      <li><a href="/contacto">Contacto</a></li>
    </ul>
    <div class="snav-right"><div class="snav-skeleton" aria-hidden="true"></div></div>
  </div>
</nav>
<script src="/static/nav.js"></script>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Contactos</span>
      <span class="sidebar-count" id="sidebar-count"></span>
    </div>
    <div class="sidebar-filters">
      <select id="filter-estado" onchange="applyFilters()">
        <option value="nuevo">Pendientes</option>
        <option value="respondido">Respondidos</option>
        <option value="">Todos</option>
      </select>
      <label>
        <input type="checkbox" id="filter-archivados" onchange="applyFilters()">
        Archivados
      </label>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="list-empty">Cargando…</div>
    </div>
  </aside>

  <!-- DETAIL -->
  <main class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">
      Selecciona un mensaje para ver el detalle.
    </div>
    <div id="detail-content" style="display:none"></div>
  </main>

</div>

<script>
(function () {
  const TIPO_LABELS = {
    informe_fifo:      'Informe FIFO',
    asistencia_fiscal: 'Asesoría fiscal',
    error_csv:         'Error CSV',
    soporte_tecnico:   'Soporte técnico',
    otro:              'Otro',
  };

  let allItems  = [];
  let currentId = null;

  // ── Carga inicial ──────────────────────────────────────────────────────────
  async function loadList() {
    const estado     = document.getElementById('filter-estado').value;
    const archivados = document.getElementById('filter-archivados').checked;

    let url = '/api/admin/contactos';
    const params = [];
    if (archivados) params.push('archivados=1');
    if (url && params.length) url += '?' + params.join('&');

    try {
      const res  = await fetch(url);
      if (res.status === 401 || res.status === 403) {
        document.getElementById('sidebar-list').innerHTML =
          '<div class="list-empty">Acceso restringido.</div>';
        return;
      }
      const data = await res.json();
      // Filtrar por estado en cliente (la API devuelve todo activo/archivado)
      allItems = estado ? data.filter(c => c.estado === estado) : data;
      renderList(allItems);
    } catch {
      document.getElementById('sidebar-list').innerHTML =
        '<div class="list-empty">Error al cargar mensajes.</div>';
    }
  }

  function applyFilters() { loadList(); }

  function renderList(items) {
    const el = document.getElementById('sidebar-list');
    document.getElementById('sidebar-count').textContent =
      items.length ? `${items.length} mensaje${items.length > 1 ? 's' : ''}` : '';

    if (!items.length) {
      el.innerHTML = '<div class="list-empty">No hay mensajes con estos filtros.</div>';
      return;
    }
    el.innerHTML = items.map(c => `
      <div class="request-item${c.id === currentId ? ' active' : ''}${c.archived_at ? ' archived' : ''}"
           data-id="${c.id}" onclick="openDetail(${c.id})">
        <div class="req-item-header">
          <div class="req-name">${esc(c.nombre)}</div>
          <span class="req-badge badge-${c.archived_at ? 'archivado' : c.estado}">
            ${c.archived_at ? 'Archivado' : (c.estado === 'respondido' ? 'Respondido' : 'Pendiente')}
          </span>
        </div>
        <div class="req-meta">
          <span>${esc(c.email_mask)}</span>
          <span>· ${esc(TIPO_LABELS[c.tipo_consulta] || c.tipo_consulta)}</span>
          <span>· ${fmtDate(c.created_at)}</span>
        </div>
        <div class="req-preview">${esc(c.mensaje_corto)}</div>
      </div>
    `).join('');
  }

  // ── Detalle ────────────────────────────────────────────────────────────────
  window.openDetail = function (id) {
    currentId = id;
    document.querySelectorAll('.request-item').forEach(el =>
      el.classList.toggle('active', parseInt(el.dataset.id) === id)
    );
    const c = allItems.find(x => x.id === id);
    if (!c) return;
    renderDetail(c);
  };

  function renderDetail(c) {
    const isArchived = !!c.archived_at;
    const tipoLabel  = TIPO_LABELS[c.tipo_consulta] || c.tipo_consulta;
    const mailtoHref = buildMailto(c);

    document.getElementById('detail-empty').style.display   = 'none';
    const el = document.getElementById('detail-content');
    el.style.display = 'block';
    el.innerHTML = `
      <div class="detail-header">
        <div class="detail-meta-id">#${c.id} · ${fmtDate(c.created_at)}</div>
        <div class="detail-name">${esc(c.nombre)}</div>
        <div class="detail-email">
          <a href="mailto:${esc(c.email)}" style="color:inherit;">${esc(c.email)}</a>
        </div>
      </div>

      <div class="detail-grid">
        ${field('Tipo', tipoLabel)}
        ${field('Estado', `<span class="req-badge badge-${isArchived ? 'archivado' : c.estado}">${isArchived ? 'Archivado' : (c.estado === 'respondido' ? 'Respondido' : 'Pendiente')}</span>`)}
        ${field('Recibido', fmtDate(c.created_at))}
        ${field('Archivado', c.archived_at ? fmtDate(c.archived_at) : '—')}
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Mensaje</div>
        <div class="text-block">${esc(c.mensaje_corto)}${c.mensaje_corto && c.mensaje_corto.length >= 120 ? '…' : ''}</div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Acciones</div>
        <div class="action-row">
          <a href="${mailtoHref}" class="action-btn" style="display:inline-block;">✉ Responder por email</a>
          ${!isArchived && c.estado !== 'respondido' ? `
            <button class="action-btn secondary" onclick="doAccion(${c.id},'responder')">Marcar respondido</button>
          ` : ''}
          ${!isArchived ? `
            <button class="action-btn danger" onclick="doAccion(${c.id},'archivar')">Archivar</button>
          ` : `
            <button class="action-btn secondary" onclick="doAccion(${c.id},'desarchivar')">Desarchivar</button>
          `}
        </div>
        <div class="msg-ok" id="accion-ok"></div>
        <div class="msg-err" id="accion-err"></div>
      </div>
    `;
  }

  function buildMailto(c) {
    const tipoLabel = TIPO_LABELS[c.tipo_consulta] || c.tipo_consulta;
    const subject   = encodeURIComponent(`Re: ${tipoLabel} — Mariano Sevilla`);
    const body      = encodeURIComponent(
      `Hola ${c.nombre},\n\nGracias por ponerte en contacto.\n\n`
    );
    return `mailto:${encodeURIComponent(c.email)}?subject=${subject}&body=${body}`;
  }

  // ── Acción PATCH ──────────────────────────────────────────────────────────
  window.doAccion = async function (id, accion) {
    const okEl  = document.getElementById('accion-ok');
    const errEl = document.getElementById('accion-err');
    if (okEl)  okEl.textContent  = '';
    if (errEl) errEl.textContent = '';

    try {
      const res  = await fetch(`/api/admin/contactos/${id}`, {
        method:  'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ accion }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (errEl) errEl.textContent = data.error || 'Error al realizar la acción.';
        return;
      }
      // Actualizar item en memoria
      const idx = allItems.findIndex(c => c.id === id);
      if (idx !== -1) {
        allItems[idx].estado      = data.estado;
        allItems[idx].archived_at = data.archived_at;
      }
      // Re-renderizar sidebar y detalle
      renderList(allItems);
      if (currentId === id) {
        const updated = allItems.find(c => c.id === id);
        if (updated) renderDetail(updated);
      }
    } catch {
      if (errEl) errEl.textContent = 'Error de conexión.';
    }
  };

  // ── Utils ──────────────────────────────────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function fmtDate(s) {
    if (!s) return '—';
    const d = new Date(s.replace(' ', 'T'));
    if (isNaN(d)) return s;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function field(label, value) {
    return `<div class="detail-field">
      <div class="detail-field-label">${label}</div>
      <div class="detail-field-value">${value}</div>
    </div>`;
  }

  // ── Arranque: leer ?estado= de la URL para preseleccionar filtro ──────────
  const urlParams = new URLSearchParams(window.location.search);
  const estadoParam = urlParams.get('estado');
  if (estadoParam) {
    const sel = document.getElementById('filter-estado');
    const opt = [...sel.options].find(o => o.value === estadoParam);
    if (opt) sel.value = estadoParam;
  }

  loadList();
})();
</script>
</body>
</html>
