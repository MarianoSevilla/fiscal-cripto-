<body>
<!-- I1: la página renderiza directamente la Apertura — sin nav del sitio,
     sin splash, sin menú. I3: columna única + dos bandas del marco. -->

<header id="ancla" class="banda">
  <p id="ancla-texto"></p>
</header>

<main id="columna">
  <!-- I4: cinco regiones en orden fijo -->
  <section id="cabecera-encuentro" class="cabecera-encuentro">
    <p id="convocatoria"></p>
    <p id="continuidad"></p>
  </section>

  <section id="bloque-apertura">
    <p id="declaracion-conjunta"></p>
    <ol id="entradas"></ol>
  </section>

  <section id="region-llegadas" hidden></section>

  <section id="periferia" hidden></section>

  <section id="region-pausa">
    <p id="pausa-texto"></p>
  </section>
</main>

<footer id="consulta" class="banda">
  <p>Consultar un área…</p>
</footer>
