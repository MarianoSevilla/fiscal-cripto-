name: QA S01 STG-B10C isolated PostgreSQL18 rehearsal

on:
  pull_request:
    branches:
      - security/s01-stg-b10b-pin-maintenance-service
    paths:
      - fiscal_app_export/private_maintenance_rehearsal.py
      - fiscal_app_export/tests/test_s01_b10c_rehearsal_contract.py
      - fiscal_app_export/tests/qa_stg_b10c_ephemeral_pg18.py
      - .github/workflows/qa-s01-stg-b10c-ephemeral-pg18.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Locked application dependencies, ephemeral test only
        run: python -m pip install -r fiscal_app_export/requirements.txt
      - name: 12 offline fail-closed security contract tests
        working-directory: fiscal_app_export
        run: python -m unittest discover -s tests -p test_s01_b10c_rehearsal_contract.py -v
      - name: PostgreSQL18 fresh bootstrap and repeated-initialization denial
        working-directory: fiscal_app_export
        env:
          CI: 'true'
        run: python tests/qa_stg_b10c_ephemeral_pg18.py
      - name: No-op runtime command always returns NO-GO
        working-directory: fiscal_app_export
        run: |
          if python private_maintenance_rehearsal.py; then
            echo "B10C runtime entrypoint unexpectedly succeeded"; exit 1
          fi
