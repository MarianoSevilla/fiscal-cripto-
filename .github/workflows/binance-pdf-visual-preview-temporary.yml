name: Binance PDF visual preview (temporary)
on:
  push:
    branches:
      - feat/binance-ux-diagnostico-pdf-20261122
    paths:
      - .github/workflows/binance-pdf-visual-preview-temporary.yml
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install reportlab==5.0.1
      - name: Generate synthetic diagnostic PDF (no client data)
        run: |
          mkdir -p /tmp/binance-visual-preview
          PYTHONPATH=fiscal_app_export python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from binance_borrador import construir_borrador_binance
          from binance_diagnostico_pdf import generar_pdf_diagnostico_binance
          fake = SimpleNamespace(compraventas=[], swaps=[], rendimientos=[], movimientos=[], desconocidas=[],
              commission_evidence_summary=SimpleNamespace(records=0),
              resumen_archivos={'transaction_history': {'detectado': True, 'vacio': False, 'registros': 32223}})
          issues = [
              {'codigo': code, 'titulo': title,
               'descripcion': 'Se necesita documentación para acreditar la operación. ' * 8,
               'siguiente_paso': 'Conserva los archivos y aporta justificantes verificables. ' * 6}
              for code,title in [
                  ('legacy', 'Operaciones históricas pendientes de valoración'),
                  ('cartera', 'Transferencias entre cuentas'),
                  ('earn_lotes', 'Historial Simple Earn incompleto'),
                  ('earn_reward', 'Recompensas Earn pendientes'),
                  ('earn_recompensas_2025', 'Prioridad de recompensas 2025'),
                  ('earn_cobertura', 'Lotes Earn'),
                  ('comisiones_referidos', 'Ingresos y comisiones'),
                  ('dust', 'Conversión de saldos pequeños a BNB'),
              ]
          ]
          report = construir_borrador_binance(fake, {'incidencias': issues}, '2025')
          data = generar_pdf_diagnostico_binance(report)
          Path('/tmp/binance-visual-preview/diagnostico_demo_sintetico_NO_FISCAL.pdf').write_bytes(data)
          print('pdf bytes:',len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binance-pdf-visual-demo-synthetic
          path: /tmp/binance-visual-preview/*.pdf
          retention-days: 1
          if-no-files-found: error
