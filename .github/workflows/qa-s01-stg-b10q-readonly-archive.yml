name: QA S01 STG-B10Q real archive READ-ONLY preflight

on:
  pull_request:
    branches:
      - security/s01-stg-b10p-restore-release-gates
    paths:
      - infra/s01_lab_restore/**
      - .github/workflows/qa-s01-stg-b10q-readonly-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-archive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Run all synthetic S01 recovery guards and S3-only audit tests
        working-directory: infra/s01_lab_restore
        run: |
          python -m unittest -v test_probe
          python -m unittest -v test_restore_candidate
          python -m unittest -v test_release_gate
          python -m unittest -v test_preflight_archive
      - name: Build READ-ONLY S3+PG18 archive verifier (no restore logic)
        run: |
          set -euo pipefail
          docker build --pull -f infra/s01_lab_restore/Dockerfile.readonly-archive \
            -t s01-b10q-readonly:ci infra/s01_lab_restore
          docker run --rm --entrypoint /bin/sh s01-b10q-readonly:ci \
            -c 'test -f /app/probe.py && test -f /app/preflight_archive.py && test ! -e /app/restore_candidate.py && test ! -e /app/release_gate.py'
      - name: Reject untrusted execution without Railway identity and print no secrets
        run: |
          set -euo pipefail
          if docker run --rm -e DATABASE_URL=postgresql://DO-NOT-LOG -e RESTORE_ALLOWED=true \
              s01-b10q-readonly:ci > "${{ runner.temp }}/audit-result.txt" 2>&1; then
            echo "NO-GO: archive verifier started with no pinned identity"; exit 1
          fi
          grep -q 'NO-GO (TARGET_WRONG_RAILWAY_IDENTITY)' "${{ runner.temp }}/audit-result.txt"
          if grep -q 'DO-NOT-LOG' "${{ runner.temp }}/audit-result.txt"; then
            echo "NO-GO: verifier leaked injected fake secret"; exit 1
          fi
          echo "B10Q CI PASS: target+S3 reader built, no restore code, fail closed without identity"
