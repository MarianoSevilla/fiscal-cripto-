name: QA S01 closeout - single guarded schema initialization candidate

on:
  pull_request:
    branches:
      - security/s01-stg-b11f-schema-catalog-real-pg18-ci
    paths:
      - fiscal_app_export/schema_preflight.py
      - fiscal_app_export/schema_bootstrap_one_shot.py
      - fiscal_app_export/Dockerfile.schema-one-shot
      - fiscal_app_export/requirements.schema-bootstrap.txt
      - fiscal_app_export/tests/test_s01_final_schema_bootstrap_gate.py
      - fiscal_app_export/tests/qa_s01_final_schema_one_shot_pg18.py
      - .github/workflows/qa-s01-final-schema-gated.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated, pinned writer dependencies in ephemeral CI
        run: python -m pip install -r fiscal_app_export/requirements.schema-bootstrap.txt
      - name: Verify 13 new fail-closed contracts and exact B11B probe copy
        working-directory: fiscal_app_export
        run: python -m unittest discover -s tests -p test_s01_final_schema_bootstrap_gate.py -v
      - name: Build NONDEPLOYED one-shot PG18 image, no app or payments
        run: |
          set -euo pipefail
          docker build --pull -f fiscal_app_export/Dockerfile.schema-one-shot \
            -t s01-schema-one-shot-candidate:ci fiscal_app_export
          docker run --rm --entrypoint /bin/sh s01-schema-one-shot-candidate:ci \
            -c 'test -e /app/schema_bootstrap_one_shot.py && test -e /app/models.py && test -d /app/migrations && test ! -e /app/app.py && test ! -e /app/bootstrap_db.py'
          if docker run --rm -e TARGET_DATABASE_URL=postgresql://FAKE-SECRET-NOT-PRINT \
            s01-schema-one-shot-candidate:ci > "$RUNNER_TEMP/deny.txt" 2>&1; then
            echo "NO-GO: unapproved schema writer started"; exit 1
          fi
          grep -q 'NO-GO (EXACT_OWNER_APPROVAL_ABSENT)' "$RUNNER_TEMP/deny.txt"
          if grep -q 'FAKE-SECRET-NOT-PRINT' "$RUNNER_TEMP/deny.txt"; then
            echo "NO-GO: DSN exposed"; exit 1
          fi
          echo "S01 SCHEMA IMAGE PASS: fail-closed, no web or provider clients"

  actual-disposable-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      localpg:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install only pinned schema dependencies
        run: python -m pip install -r fiscal_app_export/requirements.schema-bootstrap.txt
      - name: Execute ACTUAL one-shot controller on synthetic localhost PostgreSQL18
        working-directory: fiscal_app_export
        env:
          CI: "true"
        run: |
          set -euo pipefail
          python tests/qa_s01_final_schema_one_shot_pg18.py
      - name: Verify B10C remains non-executable on Railway
        working-directory: fiscal_app_export
        run: |
          set -euo pipefail
          if python private_maintenance_rehearsal.py > "$RUNNER_TEMP/b10c-blocked.log" 2>&1; then
            echo "NO-GO: B10C runtime became executable"; exit 1
          fi
          grep -q 'RUNTIME_EXECUTION_NOT_AUTHORIZED' "$RUNNER_TEMP/b10c-blocked.log"
          echo "S01 CI ONLY: real Railway still untouched"
