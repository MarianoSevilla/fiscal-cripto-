name: QA S01 STG-B10N pinned readonly recovery probe

on:
  pull_request:
    branches:
      - test/s01-stg-b10m-pristine-real-restore
    paths:
      - infra/s01_lab_restore/**
      - .github/workflows/qa-s01-stg-b10n-readonly-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-probe-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Run 14 offline security contracts (no Railway secrets)
        working-directory: infra/s01_lab_restore
        run: python -m unittest -v test_probe
      - name: Build isolated PG18.6 probe without restore code
        run: docker build --pull -t s01-b10n-readonly-probe:ci infra/s01_lab_restore
      - name: Container without pinned service must fail before any SQL
        run: |
          set -euo pipefail
          if docker run --rm s01-b10n-readonly-probe:ci > "${{ runner.temp }}/probe-result.txt" 2>&1; then
            echo "NO-GO: probe ran outside pinned lab"; exit 1
          fi
          grep -q 'S01 STG-B10N: NO-GO (WRONG_RAILWAY_IDENTITY)' "${{ runner.temp }}/probe-result.txt"
          echo "S01 B10N CI: readonly probe image denied unpinned execution; no DB traffic"
