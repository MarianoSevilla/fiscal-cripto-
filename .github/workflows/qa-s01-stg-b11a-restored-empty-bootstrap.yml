name: QA S01 STG-B11A pristine restored PG18 bootstrap only on CI

on:
  pull_request:
    branches:
      - security/s01-stg-b10s-guarded-single-restore-release
    paths:
      - fiscal_app_export/private_maintenance_rehearsal.py
      - fiscal_app_export/migrations/**
      - fiscal_app_export/tests/qa_s01_b11a_restored_bootstrap_pg18.py
      - fiscal_app_export/tests/test_s01_b11a_restored_bootstrap_scope.py
      - .github/workflows/qa-s01-stg-b11a-restored-empty-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-cluster-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      target:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      source:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Install locked dependencies only in ephemeral CI
        run: python -m pip install -r fiscal_app_export/requirements.txt
      - name: Run B10C fail-closed test suite plus B11A environment guards
        working-directory: fiscal_app_export
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_s01_b10c_rehearsal_contract.py -v
          python -m unittest discover -s tests -p test_s01_b11a_restored_bootstrap_scope.py -v
      - name: Test empty backup -> independent PG18 RESTORE -> full Alembic bootstrap
        working-directory: fiscal_app_export
        env:
          CI: "true"
        run: |
          set -euo pipefail
          python tests/qa_s01_b11a_restored_bootstrap_pg18.py
      - name: Real Railway bootstrap is permanently prohibited in B10C/B11A
        working-directory: fiscal_app_export
        run: |
          set -euo pipefail
          if python private_maintenance_rehearsal.py > "$RUNNER_TEMP/runtime-denied.txt" 2>&1; then
            echo "NO-GO: synthetic rehearsal allowed real runtime"; exit 1
          fi
          grep -q "RUNTIME_EXECUTION_NOT_AUTHORIZED" "$RUNNER_TEMP/runtime-denied.txt"
          echo "B11A runtime NO-GO confirmed; no Railway services contacted"
