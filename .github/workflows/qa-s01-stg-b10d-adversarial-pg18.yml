name: QA S01 STG-B10D adverse PostgreSQL18 fixtures

on:
  pull_request:
    branches:
      - security/s01-stg-b10c-pg18-rehearsal
    paths:
      - fiscal_app_export/tests/qa_stg_b10d_adversarial_pg18.py
      - .github/workflows/qa-s01-stg-b10d-adversarial-pg18.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg18-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [fault, healthy]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Pinned Python runtime (CI only)
        run: python -m pip install -r fiscal_app_export/requirements.txt
      - name: Validate synthetic PostgreSQL 18 scenario
        working-directory: fiscal_app_export
        env:
          CI: 'true'
        run: python tests/qa_stg_b10d_adversarial_pg18.py ${{ matrix.scenario }}
