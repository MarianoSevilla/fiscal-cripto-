name: QA S01 STG-B11D interrupted bootstrap fail-closed (CI ONLY)

on:
  pull_request:
    branches:
      - security/s01-stg-b11c-partial-bootstrap-denials
    paths:
      - fiscal_app_export/tests/qa_s01_b11d_interrupted_bootstrap_pg18.py
      - fiscal_app_export/tests/test_s01_b11d_interrupted_bootstrap_scope.py
      - .github/workflows/qa-s01-stg-b11d-interrupted-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interrupted-bootstrap-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        failure_stage: [after-models, after-stamp, mid-upgrade, after-upgrade]
    services:
      target:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Install pinned dependency lock
        run: python -m pip install -r fiscal_app_export/requirements.txt
      - name: Test 10 offline scope guards
        working-directory: fiscal_app_export
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_s01_b11d_interrupted_bootstrap_scope.py -v
      - name: Inject deterministic stop and prove NO auto retry on partial PG18
        env:
          CI: "true"
        working-directory: fiscal_app_export
        run: |
          set -euo pipefail
          python tests/qa_s01_b11d_interrupted_bootstrap_pg18.py ${{ matrix.failure_stage }}
      - name: Verify B10C runtime entrypoint STILL refuses lab execution
        working-directory: fiscal_app_export
        run: |
          set -euo pipefail
          if python private_maintenance_rehearsal.py > "$RUNNER_TEMP/b11d-denied.txt" 2>&1; then
            echo "NO-GO: B10C was runnable as live bootstrap"; exit 1
          fi
          grep -q "RUNTIME_EXECUTION_NOT_AUTHORIZED" "$RUNNER_TEMP/b11d-denied.txt"
          echo "B11D runtime NO-GO; no Railway access"
