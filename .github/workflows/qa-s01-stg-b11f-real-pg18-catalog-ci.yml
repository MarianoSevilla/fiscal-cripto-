name: QA S01 STG-B11F actual PG18 catalog SQL isolated CI

on:
  pull_request:
    branches:
      - security/s01-stg-b11e-bootstrap-release-hard-deny
    paths:
      - infra/s01_lab_schema/**
      - .github/workflows/qa-s01-stg-b11f-real-pg18-catalog-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-readonly-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: railway
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d railway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run B11B, B11E and B11F offline guards
        working-directory: infra/s01_lab_schema
        run: |
          set -euo pipefail
          python -m unittest -v test_preflight
          python -m unittest -v test_bootstrap_release_gate
          python -m unittest -v test_b11f_pg18_readonly_scope
      - name: Execute ACTUAL B11B readonly SQL against disposable PG18
        working-directory: infra/s01_lab_schema
        env:
          CI: "true"
        run: |
          set -euo pipefail
          python qa_b11f_real_pg18_readonly.py
      - name: Ensure B11B Dockerfile remains strictly readonly
        run: |
          set -euo pipefail
          docker build --pull -t s01-b11f-readonly:ci infra/s01_lab_schema
          docker run --rm --entrypoint /bin/sh s01-b11f-readonly:ci \
            -c 'test -f /app/preflight.py && test ! -e /app/qa_b11f_real_pg18_readonly.py && test ! -e /app/bootstrap_release_gate.py && test ! -e /app/real_bootstrap.py'
          echo "B11F IMAGE PASS: deployed-image candidate has no test seam or schema writer"
