name: QA dependency lock (isolated branch)

on:
  push:
    branches:
      - chore/pin-python-dependencies-20261011
    paths:
      - "fiscal_app_export/requirements.in"
      - "fiscal_app_export/requirements.txt"
      - "fiscal_app_export/.python-version"
      - ".github/workflows/qa-dependency-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-dependency-regression:
    if: github.ref == 'refs/heads/chore/pin-python-dependencies-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLASK_ENV: testing
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version

      - name: Install locked runtime and isolated QA packages
        run: |
          python -m pip install -r fiscal_app_export/requirements.txt "pytest==9.0.2" "pdfplumber==0.11.7"
          python -m pip check

      - name: Verify every direct dependency is present and every runtime pin installed exactly
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import re
          import sys
          from packaging.utils import canonicalize_name

          assert sys.version_info[:2] == (3, 13), sys.version
          source = Path("fiscal_app_export/requirements.in")
          locked = Path("fiscal_app_export/requirements.txt")
          direct = [canonicalize_name(s.strip()) for s in source.read_text().splitlines()
                    if s.strip() and not s.lstrip().startswith("#")]
          pins = {}
          for line in locked.read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.fullmatch(r"([a-zA-Z0-9_.-]+)==([a-zA-Z0-9_.+!-]+)", line)
              assert match, ("Runtime dependency not exactly pinned", line)
              name, expected = match.groups()
              key = canonicalize_name(name)
              assert key not in pins, ("Duplicate pin", key)
              pins[key] = expected
              actual = version(name)
              assert actual == expected, ("Installed version drift", name, expected, actual)
          assert len(direct) == 20, ("Unexpected manifest edits", len(direct))
          assert len(pins) >= len(direct), "No transitive dependency closure"
          assert not (set(direct) - set(pins)), ("Missing direct pins", set(direct) - set(pins))
          assert pins["psycopg2-binary"] and pins["sqlalchemy"]
          print(f"LOCK_VERIFIED: {len(direct)} direct / {len(pins)} pinned packages on Python {sys.version.split()[0]}")
          PY

      - name: Real PostgreSQL 18 schema and Alembic bootstrapping regression
        run: python fiscal_app_export/tests/qa_db_bootstrap_postgres.py

      - name: Full Python regression suite
        run: python -m pytest -q --import-mode=importlib --disable-warnings --maxfail=1 fiscal_app_export/tests tests
