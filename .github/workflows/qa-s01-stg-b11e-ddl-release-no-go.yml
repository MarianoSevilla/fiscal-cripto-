name: QA S01 STG-B11E bootstrap release hard-denial, no DDL

on:
  pull_request:
    branches:
      - security/s01-stg-b11d-interruption-matrix
    paths:
      - infra/s01_lab_schema/**
      - .github/workflows/qa-s01-stg-b11e-ddl-release-no-go.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permanently-disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate 15 existing B11B and 14 new B11E contracts
        working-directory: infra/s01_lab_schema
        run: |
          set -euo pipefail
          python -m unittest -v test_preflight
          python -m unittest -v test_bootstrap_release_gate
      - name: Enforce hard-denied entrypoint, even with approval intent
        working-directory: infra/s01_lab_schema
        run: |
          set -euo pipefail
          if S01_SCHEMA_BOOTSTRAP_APPROVAL="ONE-SCHEMA-BOOTSTRAP:POSTGRES-IM3H:7696517018472497211:z9a0b1c2d3e4" \
              python bootstrap_release_gate.py > "$RUNNER_TEMP/b11e-denied.log" 2>&1; then
            echo "NO-GO: schema gate became executable"; exit 1
          fi
          grep -q "NO-GO (DDL_NOT_AUTHORIZED)" "$RUNNER_TEMP/b11e-denied.log"
          echo "B11E RELEASE GATE PASS: source-only candidate unconditionally denies DDL"
      - name: Build existing read-only service image and exclude B11E
        run: |
          set -euo pipefail
          docker build --pull -t s01-b11e-still-readonly:ci infra/s01_lab_schema
          docker run --rm --entrypoint /bin/sh s01-b11e-still-readonly:ci \
            -c 'test -f /app/preflight.py && test ! -e /app/bootstrap_release_gate.py && test ! -e /app/real_bootstrap.py && test ! -e /app/private_maintenance_rehearsal.py'
          echo "B11E IMAGE PASS: no schema writer or approval gate in B11B image"
