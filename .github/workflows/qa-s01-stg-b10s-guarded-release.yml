name: QA S01 STG-B10S manual-authorized PG18 restore release (NOT DEPLOYED)

on:
  pull_request:
    branches:
      - security/s01-stg-b10r-live-entrypoint-disabled
    paths:
      - infra/s01_lab_restore/**
      - .github/workflows/qa-s01-stg-b10s-guarded-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Run 82 offline guards with no Railway connection
        working-directory: infra/s01_lab_restore
        run: |
          set -euo pipefail
          python -m unittest -v test_probe
          python -m unittest -v test_restore_candidate
          python -m unittest -v test_release_gate
          python -m unittest -v test_preflight_archive
          python -m unittest -v test_real_restore_entrypoint
          python -m unittest -v test_execute_one_restore
      - name: Build real-capable PG18 image but require absent manual release
        run: |
          set -euo pipefail
          docker build --pull \
            -f infra/s01_lab_restore/Dockerfile.real-restore-guarded \
            -t s01-b10s-no-live:ci infra/s01_lab_restore
          if docker run --rm -e DATABASE_URL=postgresql://TEST-NOT-PRINT \
            -e S01_RECOVERY_WRITE_APPROVAL=procede \
            s01-b10s-no-live:ci > "${{ runner.temp }}/blocked.txt" 2>&1; then
            echo "NO-GO: unapproved restore image executed"; exit 1
          fi
          grep -q 'NO-GO (EXPLICIT_ONE_RESTORE_APPROVAL_MISSING)' "${{ runner.temp }}/blocked.txt"
          if grep -q 'TEST-NOT-PRINT' "${{ runner.temp }}/blocked.txt"; then
            echo "NO-GO: restore image leaked synthetic string"; exit 1
          fi
          echo "B10S GATE PASS: no accidental SQL restore without exact manually-set approval"
      - name: Confirm current Railway read-only Dockerfile excludes writers
        run: |
          set -euo pipefail
          docker build --pull -t s01-b10s-still-readonly:ci infra/s01_lab_restore
          docker run --rm --entrypoint /bin/sh s01-b10s-still-readonly:ci \
            -c 'test -f /app/probe.py && test ! -e /app/restore_candidate.py && test ! -e /app/execute_one_restore.py'
          echo "B10S DEPLOYMENT-ISOLATION PASS: configured Dockerfile remains readonly"

  full-restore-function-synthetic-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      source:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      destination:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Verify restore_once on TWO REAL CI clusters; fake S3 marker
        env:
          CI: "true"
        working-directory: infra/s01_lab_restore
        run: python qa_b10r_real_shape_ci.py
