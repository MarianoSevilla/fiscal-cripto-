name: Required CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      # Temporary test branch for this isolated rollout. Remove before merge.
      - hardening/required-ci-gates-20261011
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLASK_ENV: testing
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout audited commit without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use project Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version

      - name: Install app and test requirements
        run: |
          python -m pip install -r fiscal_app_export/requirements.txt "pytest==9.0.2" "pdfplumber==0.11.7"
          python -m pip check

      - name: Full Python regression
        run: python -m pytest -q --import-mode=importlib --disable-warnings --maxfail=1 fiscal_app_export/tests tests

  postgres-bootstrap:
    name: postgres-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLASK_ENV: testing
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout audited commit without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use project Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version

      - name: Install app and isolated PostgreSQL test dependencies
        run: |
          python -m pip install -r fiscal_app_export/requirements.txt "pytest==9.0.2" "pdfplumber==0.11.7"
          python -m pip check

      - name: Exercise PostgreSQL 18 startup and defensive Alembic bootstrap
        run: python fiscal_app_export/tests/qa_db_bootstrap_postgres.py

  browser-navigation:
    name: browser-navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLASK_ENV: testing
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout audited commit without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use project Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version

      - name: Install app, browser and test dependencies
        run: |
          python -m pip install -r fiscal_app_export/requirements.txt "playwright==1.57.0"
          python -m playwright install --with-deps chromium
          python -m pip check

      - name: Navigation against real browser and in-repo static files
        run: python fiscal_app_export/tests/qa_responsive_nav.py

      - name: Responsive Home viewport geometry
        run: python fiscal_app_export/tests/qa_responsive_layout.py

      - name: Flask navigation and access checks with synthetic SQLite data
        run: python fiscal_app_export/tests/qa_flask_navigation.py

      - name: Keep non-sensitive responsive screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-ci-responsive-screenshots
          path: qa-artifacts/home_*.png
          retention-days: 7
          if-no-files-found: ignore
