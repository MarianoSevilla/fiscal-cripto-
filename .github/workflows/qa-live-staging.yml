name: Live staging smoke (solo GET)

on:
  push:
    branches:
      - integration/staging-responsive-db-bootstrap-20261010
    paths:
      - "fiscal_app_export/tests/qa_staging_http_smoke.py"
      - ".github/workflows/qa-live-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_URL: https://fiscal-cripto-staging-staging.up.railway.app

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version

      - name: Herramientas HTTP y navegador (versiones fijadas)
        run: |
          python -m pip install "playwright==1.57.0" "requests==2.34.2"
          python -m playwright install --with-deps chromium

      - name: Smoke contra staging real (GET sin usuarios)
        run: python fiscal_app_export/tests/qa_staging_http_smoke.py

      - name: Conservar capturas para revisión
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capturas-live-staging
          path: staging-smoke-artifacts/staging_home_*.png
          retention-days: 7
          if-no-files-found: ignore
