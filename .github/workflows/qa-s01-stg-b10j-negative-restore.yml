name: QA S01 STG-B10J fail-closed backup restoration

on:
  pull_request:
    branches:
      - test/s01-stg-b10i-restore-drill
    paths:
      - fiscal_app_export/private_restore_evidence_gate.py
      - fiscal_app_export/tests/test_s01_b10j_restore_evidence_contract.py
      - .github/workflows/qa-s01-stg-b10j-negative-restore.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      source:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      target:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Offline metadata NO-GO contract (15 synthetic cases)
        working-directory: fiscal_app_export
        run: python -m unittest discover -s tests -p test_s01_b10j_restore_evidence_contract.py -v
      - name: Generate fake backup against disposable source and empty target
        env:
          PGPASSWORD: ci-only-test-password
        run: |
          set -euo pipefail
          for port in 5432 55433; do
            docker run --rm --network host -e PGPASSWORD postgres:18 \
              psql -h 127.0.0.1 -p "$port" -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -c 'CREATE DATABASE railway;'
          done
          docker run --rm --network host -e PGPASSWORD postgres:18 \
            psql -h 127.0.0.1 -p 5432 -U postgres -d railway \
              -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.ci_backup_fixture (id int primary key); INSERT INTO public.ci_backup_fixture VALUES (42);'
          docker run --rm --network host -e PGPASSWORD \
              -v "${{ runner.temp }}:/snapshot" postgres:18 \
            pg_dump -h 127.0.0.1 -p 5432 -U postgres -d railway \
              --format=custom --no-owner --no-acl \
              -f /snapshot/valid-synthetic.dump
          test -s "${{ runner.temp }}/valid-synthetic.dump"
          (cd "${{ runner.temp }}" && sha256sum valid-synthetic.dump > valid.sha256)
      - name: Ensure corrupted archive is rejected BEFORE a restore can be trusted
        env:
          PGPASSWORD: ci-only-test-password
        run: |
          set -euo pipefail
          cp "${{ runner.temp }}/valid-synthetic.dump" "${{ runner.temp }}/corrupt-synthetic.dump"
          truncate -s 8 "${{ runner.temp }}/corrupt-synthetic.dump"
          (cd "${{ runner.temp }}" && sha256sum -c valid.sha256)
          if cmp -s "${{ runner.temp }}/valid-synthetic.dump" "${{ runner.temp }}/corrupt-synthetic.dump"; then
            echo "NO-GO: corruption fixture unchanged"; exit 1
          fi
          if docker run --rm --network host -e PGPASSWORD \
              -v "${{ runner.temp }}:/snapshot:ro" postgres:18 \
              pg_restore --list /snapshot/corrupt-synthetic.dump >/dev/null 2>&1; then
            echo "NO-GO: corrupted backup passed archive parsing"; exit 1
          fi
          if docker run --rm --network host -e PGPASSWORD \
              -v "${{ runner.temp }}:/snapshot:ro" postgres:18 \
              pg_restore -h 127.0.0.1 -p 55433 -U postgres -d railway \
                --exit-on-error /snapshot/corrupt-synthetic.dump >/dev/null 2>&1; then
            echo "NO-GO: corrupted backup unexpectedly restored"; exit 1
          fi
          relations="$(docker run --rm --network host -e PGPASSWORD postgres:18 \
            psql -h 127.0.0.1 -p 55433 -U postgres -d railway \
              -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public';")"
          test "$relations" = 0 || { echo "NO-GO: damaged archive created public relations"; exit 1; }
          echo "B10J PASS: broken pg_dump rejected, exit status nonzero; disposable target intact"
