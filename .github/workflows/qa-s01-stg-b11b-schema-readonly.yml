name: QA S01 STG-B11B dedicated readonly schema target

on:
  pull_request:
    branches:
      - security/s01-stg-b11a-restored-empty-bootstrap-ci
    paths:
      - infra/s01_lab_schema/**
      - .github/workflows/qa-s01-stg-b11b-schema-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dedicated-schema-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run 15 offline fail-closed contracts
        working-directory: infra/s01_lab_schema
        run: python -m unittest -v test_preflight
      - name: Build PostgreSQL18 readonly image excluding migration code
        run: |
          set -euo pipefail
          docker build --pull -t s01-b11b-readonly:ci infra/s01_lab_schema
          docker run --rm --entrypoint /bin/sh s01-b11b-readonly:ci \
            -c 'test -f /app/preflight.py && test ! -f /app/app.py && test ! -f /app/bootstrap_db.py && test ! -d /app/migrations'
      - name: Without exact Railway identity must reject before SQL
        run: |
          set -euo pipefail
          if docker run --rm -e TARGET_DATABASE_URL=postgresql://FAKE-DO-NOT-LEAK \
              s01-b11b-readonly:ci > "$RUNNER_TEMP/output.txt" 2>&1; then
            echo "NO-GO: readonly probe bypassed identity"; exit 1
          fi
          grep -q 'NO-GO (RAILWAY_IDENTITY)' "$RUNNER_TEMP/output.txt"
          if grep -q 'FAKE-DO-NOT-LEAK' "$RUNNER_TEMP/output.txt"; then
            echo "NO-GO: fake secret leaked"; exit 1
          fi
          echo "B11B CI PASS: isolated PG18 schema probe fails closed outside pinned lab"
