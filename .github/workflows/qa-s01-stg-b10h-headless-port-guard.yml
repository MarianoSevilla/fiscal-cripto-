name: QA S01 STG-B10H private headless PORT guard

on:
  pull_request:
    branches:
      - security/s01-stg-b10g-live-readonly-fingerprint
    paths:
      - fiscal_app_export/private_maintenance_preflight.py
      - fiscal_app_export/tests/test_s01_private_maintenance_preflight.py
      - fiscal_app_export/tests/test_s01_b10g_private_cluster_identity.py
      - .github/workflows/qa-s01-stg-b10h-headless-port-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Read-only identity and forbidden network contracts (offline)
        working-directory: fiscal_app_export
        run: |
          python -m unittest discover -s tests -p test_s01_private_maintenance_preflight.py -v
          python -m unittest discover -s tests -p test_s01_b10g_private_cluster_identity.py -v
