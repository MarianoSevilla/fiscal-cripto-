name: QA S01 STG-B10P restore release gates (no live deploy)

on:
  pull_request:
    branches:
      - security/s01-stg-b10o-restore-candidate-no-live
    paths:
      - infra/s01_lab_restore/**
      - .github/workflows/qa-s01-stg-b10p-release-gates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-hard-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Verify pinned lab read-only, candidate, and compile-time NO-GO
        working-directory: infra/s01_lab_restore
        run: |
          python -m unittest -v test_probe
          python -m unittest -v test_restore_candidate
          python -m unittest -v test_release_gate
      - name: Build existing readonly Railway image, verify restore code ABSENT
        run: |
          set -euo pipefail
          docker build --pull -t s01-b10p-current-readonly:ci infra/s01_lab_restore
          docker run --rm --entrypoint /bin/sh s01-b10p-current-readonly:ci \
            -c 'test -f /app/probe.py && test ! -e /app/restore_candidate.py && test ! -e /app/release_gate.py'
          echo "B10P LIVE-IMAGE PASS: only read-only probe included"
      - name: Build candidate disabled image, verify runtime NO-GO
        run: |
          set -euo pipefail
          docker build --pull -f infra/s01_lab_restore/Dockerfile.candidate-disabled \
            -t s01-b10p-candidate-disabled:ci infra/s01_lab_restore
          if docker run --rm -e RESTORE_ALLOWED=true -e B10P_ALLOW_REAL=true \
             -e RAILWAY_PROJECT_ID=malicious s01-b10p-candidate-disabled:ci \
             > "${{ runner.temp }}/log.txt" 2>&1; then
            echo "NO-GO: candidate was executable"; exit 1
          fi
          grep -q 'S01 STG-B10P: NO-GO (REAL_RESTORE_NOT_AUTHORIZED)' "${{ runner.temp }}/log.txt"
          if grep -Eq '(postgresql://|fake-only-secret)' "${{ runner.temp }}/log.txt"; then
            echo "NO-GO: sensitive data exposed"; exit 1
          fi
          echo "B10P RELEASE GATE PASS: candidate refuses runtime activation"
