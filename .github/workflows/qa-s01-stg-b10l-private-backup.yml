name: QA S01 STG-B10L private one-shot backup runner

on:
  pull_request:
    branches:
      - test/s01-stg-b10k-content-integrity
    paths:
      - infra/s01_lab_backup/**
      - .github/workflows/qa-s01-stg-b10l-private-backup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-runner-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: 17 fail-closed synthetic contracts, no network
        working-directory: infra/s01_lab_backup
        run: python -m unittest -v test_backup
      - name: Build independent PG18 backup client image, without secrets
        run: docker build --pull -t s01-b10l-offline-check:ci infra/s01_lab_backup
      - name: Unconfigured standalone container must deny starting
        run: |
          set -euo pipefail
          if docker run --rm s01-b10l-offline-check:ci > "${{ runner.temp }}/output.txt" 2>&1; then
            echo "NO-GO: backup worker ran outside pinned lab"; exit 1
          fi
          grep -q "S01 STG-B10L: NO-GO (WRONG_LAB_IDENTITY)" "${{ runner.temp }}/output.txt"
          echo "B10L CI PASS: guarded image refuses execution outside pinned S01 LAB"
