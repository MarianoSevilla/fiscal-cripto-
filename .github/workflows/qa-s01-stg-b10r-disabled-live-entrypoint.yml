name: QA S01 STG-B10R final-shaped restore gated, CI-only PG18

on:
  pull_request:
    branches:
      - security/s01-stg-b10q-live-readonly-preflight
    paths:
      - infra/s01_lab_restore/**
      - .github/workflows/qa-s01-stg-b10r-disabled-live-entrypoint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-release-disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Regress all 72 synthetic identity/S3/recovery/release contracts
        working-directory: infra/s01_lab_restore
        run: |
          set -euo pipefail
          python -m unittest -v test_probe
          python -m unittest -v test_restore_candidate
          python -m unittest -v test_release_gate
          python -m unittest -v test_preflight_archive
          python -m unittest -v test_real_restore_entrypoint
      - name: Build final-shaped but source-disabled Dockerfile
        run: |
          set -euo pipefail
          docker build --pull -f infra/s01_lab_restore/Dockerfile.real-restore-disabled \
            -t b10r-real-restore-disabled:ci infra/s01_lab_restore
          if docker run --rm -e APPPROVE_REAL_RESTORE=true \
            -e LIVE_RESTORE_ALLOWED=true \
            -e RAILWAY_ENVIRONMENT_ID=production \
            -e DATABASE_URL=postgresql://DO-NOT-LEAK \
            b10r-real-restore-disabled:ci > "${{ runner.temp }}/guard.log" 2>&1; then
            echo "NO-GO: restore image executed"; exit 1
          fi
          grep -q 'NO-GO (AWAITING_SEPARATE_RESTORE_AUTHORIZATION)' "${{ runner.temp }}/guard.log"
          if grep -q 'DO-NOT-LEAK' "${{ runner.temp }}/guard.log"; then
            echo "NO-GO: guard leaked synthetic secret"; exit 1
          fi
          echo "B10R NO-LIVE PASS: final-shaped image cannot execute real restore"

  actual-restore-function-synthetic-clusters:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      source:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      destination:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci-only-test-password}
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Execute restore_once with real disposable PG18 SQL and fake S3
        env:
          CI: "true"
        working-directory: infra/s01_lab_restore
        run: |
          set -euo pipefail
          python qa_b10r_real_shape_ci.py
