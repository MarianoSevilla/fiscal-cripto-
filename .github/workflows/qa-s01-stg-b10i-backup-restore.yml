name: QA S01 STG-B10I isolated PG18 backup and restore

on:
  pull_request:
    branches:
      - security/s01-stg-b10h-headless-port-guard
    paths:
      - fiscal_app_export/tests/qa_stg_b10i_pg18_backup_restore.py
      - .github/workflows/qa-s01-stg-b10i-backup-restore.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logical-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      source:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      target:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version
      - name: Install pinned project dependencies (CI fixtures)
        run: python -m pip install -r fiscal_app_export/requirements.txt
      - name: Initialize source and empty target (synthetic only)
        env:
          CI: 'true'
        working-directory: fiscal_app_export
        run: python tests/qa_stg_b10i_pg18_backup_restore.py setup
      - name: PostgreSQL 18 native custom logical backup (CI-local only)
        env:
          PGPASSWORD: ci-only-test-password
        run: |
          docker run --rm --network host \
            -e PGPASSWORD -v "${{ runner.temp }}:/snapshot" postgres:18 \
            pg_dump -h 127.0.0.1 -p 5432 -U postgres -d railway \
              --format=custom --no-owner --no-acl \
              -f /snapshot/s01-ci-synthetic-only.dump
          test -s "${{ runner.temp }}/s01-ci-synthetic-only.dump"
          sha256sum "${{ runner.temp }}/s01-ci-synthetic-only.dump" > "${{ runner.temp }}/s01-ci-synthetic-only.sha256"
          (cd "${{ runner.temp }}" && sha256sum -c s01-ci-synthetic-only.sha256)
      - name: Restore into independent disposable PostgreSQL18
        env:
          PGPASSWORD: ci-only-test-password
        run: |
          docker run --rm --network host \
            -e PGPASSWORD -v "${{ runner.temp }}:/snapshot:ro" postgres:18 \
            pg_restore -h 127.0.0.1 -p 55433 -U postgres -d railway \
              --exit-on-error --no-owner --no-acl \
              /snapshot/s01-ci-synthetic-only.dump
      - name: Verify recovery integrity on separate cluster
        env:
          CI: 'true'
        working-directory: fiscal_app_export
        run: python tests/qa_stg_b10i_pg18_backup_restore.py verify
