name: QA PostgreSQL bootstrap aislado

on:
  push:
    branches:
      - fix/fresh-postgres-alembic-bootstrap-20261010
      - integration/staging-responsive-db-bootstrap-20261010
      - release/2026-10-10-responsive-postgres
      - hotfix/psycopg2-explicit-dialect-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-bootstrap:
    if: github.ref == 'refs/heads/fix/fresh-postgres-alembic-bootstrap-20261010' || github.ref == 'refs/heads/integration/staging-responsive-db-bootstrap-20261010' || github.ref == 'refs/heads/release/2026-10-10-responsive-postgres' || github.ref == 'refs/heads/hotfix/psycopg2-explicit-dialect-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: fiscal_app_export/.python-version

      - name: Dependencias de aplicación y suite
        run: |
          python -m pip install -r fiscal_app_export/requirements.txt "pytest==9.0.2" "pdfplumber==0.11.7"

      - name: PostgreSQL 18 real - arranque limpio, repetición y bloqueos preventivos
        run: python fiscal_app_export/tests/qa_db_bootstrap_postgres.py

      - name: Suite Python sin red externa ni credenciales de producción
        run: python -m pytest -q --import-mode=importlib --disable-warnings --maxfail=1 fiscal_app_export/tests tests
